<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpollo - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="design-system.css">

    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: var(--space-5);
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            padding: var(--space-8) var(--space-6);
            text-align: center;
        }

        .login-box h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            margin: 0 0 var(--space-2);
            font-size: 26px;
        }

        .login-box h1 .fa-utensils {
            color: var(--color-brand);
        }

        .login-box p.subtitle {
            margin: 0 0 var(--space-6);
            color: var(--color-text-muted);
            font-size: 14px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .field {
            text-align: left;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: var(--space-4);
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
            pointer-events: none;
        }

        .input-group .input {
            padding-left: 44px;
        }

        .submit-btn {
            width: 100%;
            margin-top: var(--space-2);
        }

        .error-message {
            margin: 0;
            font-size: 13px;
            color: var(--color-brand);
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box card">
        <h1><i class="fas fa-utensils"></i>Olimpollo</h1>
        <p class="subtitle">Bienvenido de nuevo</p>

        <form id="login-form">
            <div class="field">
                <div class="input-group">
                    <input type="text" id="username" class="input" required autocomplete="username" placeholder="Usuario">
                    <i class="fas fa-user"></i>
                </div>
            </div>
            <div class="field">
                <div class="input-group">
                    <input type="password" id="password" class="input" required autocomplete="current-password" placeholder="Clave">
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg submit-btn" id="submit-btn">Iniciar Sesión</button>
            <p id="error-message" class="error-message"></p>
        </form>
    </div>

<script>
    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorMessage = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMessage.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Ingresando...';

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        try {
            const response = await fetch('https://olimpollo-api.onrender.com/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Error desconocido.');
            }

            localStorage.setItem('authToken', data.token);
            localStorage.setItem('userRole', data.rol);
            window.location.href = 'index.html';

        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Iniciar Sesión';
        }
    });
</script>
</body>
</html>
