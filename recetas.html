<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Olimpollo - Recetas</title>
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--color-surface); padding: 15px 40px; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); }
        header .logo { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-decoration: none; color: var(--color-text); }
        header nav { display: flex; gap: 20px; }
        header nav a { text-decoration: none; color: var(--color-text-muted); font-weight: 600; font-size: 14px; transition: color 0.2s; }
        header nav a:hover { color: var(--color-brand); }
        .user-info { display: flex; align-items: center; gap: 16px; }
        #user-identifier { font-weight: 600; background: var(--color-surface-alt); padding: 5px 12px; border-radius: var(--radius-full); font-size: 13px; }

        main { flex: 1; padding: 40px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .page-title { margin-bottom: 30px; font-size: 26px; }
        .card { background: var(--color-surface); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow-sm); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; background: var(--color-surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
        th, td { padding: 14px 15px; text-align: left; border-bottom: 1px solid var(--color-border); }
        th { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--color-text-muted); background: var(--color-surface-alt); }
        tr:hover td { background: var(--color-brand-tint); }
        footer { text-align: center; padding: 20px; font-size: 13px; color: var(--color-text-muted); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 17, 21, 0.6); justify-content: center; align-items: center; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--color-surface); color: var(--color-text); padding: 28px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 90%; max-width: 600px; max-height: calc(100vh - 40px); overflow-y: auto; position: relative; margin: auto; }
        .modal-content .close { position: absolute; top: 16px; right: 18px; font-size: 22px; cursor: pointer; color: var(--color-text-muted); background: none; border: none; }
        .modal-content .close:hover { color: var(--color-text); }

        /* Estilos específicos para esta página */
        .layout-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; align-items: flex-start; }
        .action-bar { margin-bottom: 25px; }
        .item-adder { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 15px; align-items: flex-end; margin-bottom: 15px; }
        .item-adder-pasos { grid-template-columns: 1fr auto; }
        .item-list { list-style-position: inside; padding-left: 0; margin-top: 0; }
        .item-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-radius: var(--radius-sm); }
        .item-list li:nth-child(odd) { background-color: var(--color-surface-alt); }
        .remove-item { cursor: pointer; color: var(--color-brand); font-weight: bold; font-size: 20px; padding: 0 10px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Olimpollo</a>
        <nav>
          <a href="pedidos.html">POS</a>
          <a href="reportes.html">Reportes</a>
          <a href="pedidos_lista.html">Pedidos</a>
          <a href="inventario.html">Inventario</a>
        </nav>
        <div class="user-info">
            <span id="user-identifier"></span>
            <button class="btn btn-secondary btn-sm" id="btn-logout">Cerrar Sesión</button>
        </div>
    </header>

    <main>
        <h2 class="page-title ds-display">Gestión de Recetas</h2>
        <div class="layout-grid">
            <div class="recetas-lista">
                <div class="action-bar">
                    <button class="btn btn-primary" id="btn-agregar-receta"><i class="fas fa-plus"></i> Agregar Nueva Receta</button>
                </div>
                <table>
                    <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr></thead>
                    <tbody id="tabla-recetas-body"></tbody>
                </table>
            </div>

            <div class="recetas-detalles card">
                <h3 id="detalle-titulo">Detalles de la Receta</h3>
                <div id="detalle-contenido">
                    <p>Selecciona una receta de la lista para ver sus detalles aquí.</p>
                </div>
            </div>
        </div>
    </main>

    <div id="modalReceta" class="modal">
        <div class="modal-content">
            <button type="button" class="close">&times;</button>
            <h3 id="modal-titulo">Agregar Receta</h3>
            <form id="form-receta">
                <input type="hidden" id="receta-id">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div>
                        <label for="receta-nombre">Nombre de la Receta:</label>
                        <input type="text" id="receta-nombre" class="input" required>
                    </div>
                    <div>
                        <label for="producto-venta-id">Vincular a Producto:</label>
                        <select id="producto-venta-id" class="select"><option value="">-- Ninguno --</option></select>
                    </div>
                </div>
                <div style="margin-bottom: 20px;">
                    <label for="receta-descripcion">Descripción Corta:</label>
                    <textarea id="receta-descripcion" class="textarea" rows="2"></textarea>
                </div>
                <hr style="border: none; border-top: 1px solid var(--color-border); margin: 20px 0;">

                <h4>Ingredientes</h4>
                <div class="item-adder">
                    <div><label>Insumo:</label><select id="select-insumo" class="select"></select></div>
                    <div><label>Cantidad:</label><input type="number" id="cantidad-necesaria" class="input" min="0.001" step="0.001"></div>
                    <div><label>Unidad:</label><input type="text" id="unidad-medida" class="input" placeholder="Ej: Kg, L"></div>
                    <button type="button" class="btn btn-secondary" id="btn-agregar-ingrediente">Añadir</button>
                </div>
                <ul class="item-list" id="lista-ingredientes"></ul>
                <hr style="border: none; border-top: 1px solid var(--color-border); margin: 20px 0;">

                <h4>Pasos de Preparación</h4>
                <div class="item-adder item-adder-pasos">
                    <div><label>Descripción del Paso:</label><textarea id="paso-descripcion" class="textarea" rows="2"></textarea></div>
                    <button type="button" class="btn btn-secondary" id="btn-agregar-paso">Añadir</button>
                </div>
                <ol class="item-list" id="lista-pasos"></ol>
                <hr style="border: none; border-top: 1px solid var(--color-border); margin: 20px 0;">

                <button type="submit" class="btn btn-primary btn-lg" id="btn-guardar-receta" style="width: 100%;">Guardar Receta</button>
            </form>
        </div>
    </div>

    <footer>&copy; 2026 Los Boneless del Olimpo</footer>

    <script src="design-system.js"></script>

    <script>
(function() {
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        const response = await originalFetch(...args);
        if (response.status === 401) {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userRole');
            if (!location.pathname.endsWith('login.html')) window.location.href = 'login.html';
        }
        return response;
    };
})();
function parseJwt(token) { try { return JSON.parse(decodeURIComponent(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))); } catch(e){return null;} }
document.addEventListener('DOMContentLoaded', () => {

    // --- 1. CONFIGURACIÓN DE API Y ESTADO GLOBAL ---
    const API_BASE_URL = 'https://olimpollo-api.onrender.com/api';
    const API_RECETAS_URL = `${API_BASE_URL}/recetas`;
    const API_INSUMOS_URL = `${API_BASE_URL}/inventario`;
    const API_MENU_PRODUCTOS_URL = `${API_BASE_URL}/menu/productos`;

    const token = localStorage.getItem('authToken');
    if (!token) { window.location.href = 'login.html'; return; }
    const userData = parseJwt(token);
    if (userData && userData.username) document.getElementById('user-identifier').textContent = userData.username;

    let recetas = [];
    let insumosDisponibles = [];
    let productosVenta = [];
    let tempIngredientes = [];
    let tempPasos = [];

    // --- 2. ELEMENTOS DEL DOM ---
    const tablaBody = document.getElementById('tabla-recetas-body');
    const detalleContenido = document.getElementById('detalle-contenido');
    const detalleTitulo = document.getElementById('detalle-titulo');
    const btnLogout = document.getElementById('btn-logout');
    const modalReceta = document.getElementById('modalReceta');
    const modalTitulo = document.getElementById('modal-titulo');
    const formReceta = document.getElementById('form-receta');
    const btnAgregarReceta = document.getElementById('btn-agregar-receta');

    // Inputs del formulario
    const recetaIdInput = document.getElementById('receta-id');
    const recetaNombreInput = document.getElementById('receta-nombre');
    const recetaDescInput = document.getElementById('receta-descripcion');
    const productoVentaSelect = document.getElementById('producto-venta-id');
    const selectInsumo = document.getElementById('select-insumo');
    const cantidadNecesariaInput = document.getElementById('cantidad-necesaria');
    const unidadMedidaInput = document.getElementById('unidad-medida');
    const listaIngredientes = document.getElementById('lista-ingredientes');
    const btnAgregarIngrediente = document.getElementById('btn-agregar-ingrediente');
    const pasoDescripcionTextarea = document.getElementById('paso-descripcion');
    const listaPasos = document.getElementById('lista-pasos');
    const btnAgregarPaso = document.getElementById('btn-agregar-paso');

    // --- 3. FUNCIONES DE UTILIDAD Y UI ---
    const abrirModal = (modal) => modal.style.display = 'flex';
    const cerrarModales = () => {
        modalReceta.style.display = 'none';
    };
    const cerrarSesion = () => {
        localStorage.removeItem('authToken');
        localStorage.removeItem('userRole');
        window.location.href = 'login.html';
    };

    const renderTempItems = () => {
        listaIngredientes.innerHTML = '';
        tempIngredientes.forEach((ing, index) => {
            const insumo = insumosDisponibles.find(i => i.id == ing.insumo_id);
            const nombreInsumo = insumo ? insumo.nombre : 'Insumo Desconocido';
            const li = document.createElement('li');
            li.innerHTML = `<span>${ing.cantidad_necesaria} ${ing.unidad_medida} de <strong>${nombreInsumo}</strong></span> <span class="remove-item" data-index="${index}">&times;</span>`;
            listaIngredientes.appendChild(li);
        });

        listaPasos.innerHTML = '';
        tempPasos.forEach((paso, index) => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${paso}</span> <span class="remove-item" data-type="paso" data-index="${index}">&times;</span>`;
            listaPasos.appendChild(li);
        });
    };

    // --- 4. CARGA DE DATOS INICIALES ---
    const cargarDatosIniciales = async () => {
        try {
            const [resInsumos, resProductos] = await Promise.all([
                fetch(API_INSUMOS_URL, { headers: { 'Authorization': `Bearer ${token}` } }),
                fetch(API_MENU_PRODUCTOS_URL, { headers: { 'Authorization': `Bearer ${token}` } })
            ]);
            if (!resInsumos.ok || !resProductos.ok) throw new Error('Fallo al cargar datos iniciales.');

            insumosDisponibles = await resInsumos.json();
            productosVenta = await resProductos.json();

            // Llenar select de insumos
            selectInsumo.innerHTML = '<option value="">-- Seleccionar Insumo --</option>';
            insumosDisponibles.forEach(insumo => {
                const option = document.createElement('option');
                option.value = insumo.id;
                option.textContent = `${insumo.nombre} (${insumo.unidad})`;
                selectInsumo.appendChild(option);
            });

            // Llenar select de productos de venta
            productoVentaSelect.innerHTML = '<option value="">-- Ninguno --</option>';
            productosVenta.forEach(p => {
                const option = document.createElement('option');
                option.value = p.id;
                option.textContent = p.nombre_venta;
                productoVentaSelect.appendChild(option);
            });

        } catch (error) {
            console.error('Error cargando datos:', error);
            DS.toast('Error crítico: No se pudieron cargar los insumos y productos. Recargue la página.', { type: 'error', duration: 0 });
        }
    };

    // --- 5. FUNCIONES CRUD (FETCH) ---

    const renderRecetas = async () => {
        try {
            const response = await fetch(API_RECETAS_URL, { headers: { 'Authorization': `Bearer ${token}` } });
            if (!response.ok) throw new Error('Error al cargar recetas');
            recetas = await response.json();

            tablaBody.innerHTML = '';
            if (recetas.length === 0) {
                tablaBody.innerHTML = '<tr><td colspan="4">No hay recetas registradas.</td></tr>';
            }

            recetas.forEach(receta => {
                const tr = document.createElement('tr');
                tr.dataset.recetaId = receta.id;
                const descCorta = receta.descripcion ? (receta.descripcion.substring(0, 50) + '...') : 'Sin descripción';
                tr.innerHTML = `
                    <td>${receta.id.toString().padStart(3, '0')}</td>
                    <td>${receta.nombre}</td>
                    <td>${descCorta}</td>
                    <td style="display:flex; gap:8px;">
                        <button type="button" class="btn btn-secondary btn-sm btn-edit" data-id="${receta.id}">Editar</button>
                        <button type="button" class="btn btn-danger-outline btn-sm btn-eliminar" data-id="${receta.id}">Eliminar</button>
                    </td>
                `;
                tablaBody.appendChild(tr);
            });
            mostrarDetalles(null);
        } catch (error) {
            console.error('Error al renderizar recetas:', error);
            tablaBody.innerHTML = '<tr><td colspan="4" style="color:var(--color-brand); font-weight:bold;">Error al conectar con el servidor.</td></tr>';
        }
    };

    const guardarReceta = async (recetaData, id) => {
        const isEdit = !!id;
        const url = isEdit ? `${API_RECETAS_URL}/${id}` : API_RECETAS_URL;
        const method = isEdit ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(recetaData)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || `Error al ${isEdit ? 'actualizar' : 'crear'} la receta.`);
            }

            DS.toast(`Receta "${recetaData.nombre}" ${isEdit ? 'actualizada' : 'creada'} exitosamente.`, { type: 'success' });
            cerrarModales();
            await cargarDatosIniciales(); // Recargar productos por si la vinculación cambió
            await renderRecetas();
        } catch (error) {
            console.error('Error al guardar receta:', error);
            DS.toast(`Error: ${error.message}`, { type: 'error', duration: 0 });
        }
    };

    const eliminarReceta = async (id) => {
        try {
            const response = await fetch(`${API_RECETAS_URL}/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            if (!response.ok) throw new Error('No se pudo eliminar la receta.');

            DS.toast('Receta eliminada exitosamente.', { type: 'success' });
            await renderRecetas();
        } catch (error) {
            console.error('Error al eliminar receta:', error);
            DS.toast('Error: ' + error.message, { type: 'error', duration: 0 });
        }
    };

    const money = (v) => '$' + Number(v).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // Costeo en vivo: costo de receta (sin modificadores, son variables por pedido) contra
    // el precio de venta del producto vinculado. Usa insumosDisponibles (ya trae
    // costo_promedio de /api/inventario), así que no depende de ningún reporte.
    const calcularCosteoReceta = (receta) => {
        const tieneIngredientes = receta.ingredientes && receta.ingredientes[0] && receta.ingredientes[0].insumo_id;
        if (!tieneIngredientes) return null;
        let costo = 0; const insumosSinCosto = [];
        receta.ingredientes.forEach(ing => {
            const insumo = insumosDisponibles.find(i => i.id == ing.insumo_id);
            const costoUnitario = insumo ? parseFloat(insumo.costo_promedio || 0) : 0;
            if (costoUnitario <= 0) insumosSinCosto.push(ing.nombre || (insumo ? insumo.nombre : `Insumo #${ing.insumo_id}`));
            costo += ing.cantidad_necesaria * costoUnitario;
        });
        const productoVinculado = productosVenta.find(p => p.receta_id == receta.id);
        const precio = productoVinculado ? parseFloat(productoVinculado.precio_base || 0) : null;
        // precio_base puede ser 0 en productos legacy/sin precio asignado — no es lo mismo
        // que "sin producto vinculado", pero igual impide calcular un margen real.
        const tienePrecio = precio !== null && precio > 0;
        const margen = tienePrecio ? precio - costo : null;
        const margenPct = tienePrecio ? (margen / precio) * 100 : null;
        return { costo, insumosSinCosto, precio, tienePrecio, margen, margenPct, productoVinculado };
    };

    const mostrarDetalles = (id) => {
        detalleTitulo.textContent = 'Detalles de la Receta';
        detalleContenido.innerHTML = '<p>Selecciona una receta de la lista para ver sus detalles.</p>';
        if (!id) return;

        const receta = recetas.find(r => r.id == id);
        if (!receta) return;

        detalleTitulo.textContent = receta.nombre;
        let contenidoHTML = `
            <h4>Descripción:</h4><p>${receta.descripcion || 'N/A'}</p>
            <h4>Ingredientes:</h4><ul>`;
        if (receta.ingredientes && receta.ingredientes[0].insumo_id) { // Verificar si hay ingredientes reales
            receta.ingredientes.forEach(ing => {
                contenidoHTML += `<li><strong>${ing.nombre}:</strong> ${ing.cantidad_necesaria} ${ing.unidad_medida}</li>`;
            });
        }
        contenidoHTML += '</ul>';

        const costeo = calcularCosteoReceta(receta);
        if (costeo) {
            const costoIncompleto = costeo.insumosSinCosto.length > 0;
            contenidoHTML += `<h4>💰 Costeo</h4>`;
            if (costoIncompleto) {
                contenidoHTML += `<p style="font-size:0.85em; color:var(--color-brand);">⚠️ Costo no confiable: ${costeo.insumosSinCosto.join(', ')} no tiene costo capturado (Inventario &rarr; Editar Insumo).</p>`;
            } else {
                contenidoHTML += `<p><strong>Costo de receta:</strong> ${money(costeo.costo)}</p>`;
                if (costeo.tienePrecio) {
                    const colorMargen = costeo.margen <= 0 ? 'var(--color-brand)' : (costeo.margenPct < 40 ? 'var(--color-warning)' : 'var(--color-success)');
                    contenidoHTML += `
                        <p><strong>Precio de venta (${costeo.productoVinculado.nombre_venta}):</strong> ${money(costeo.precio)}</p>
                        <p><strong>Margen:</strong> <span style="color:${colorMargen}; font-weight:bold;">${money(costeo.margen)} (${costeo.margenPct.toFixed(1)}%)</span></p>`;
                } else if (costeo.productoVinculado) {
                    contenidoHTML += `<p style="color:var(--color-brand); font-size:0.85em;">⚠️ El producto vinculado (${costeo.productoVinculado.nombre_venta}) tiene precio de venta $0 — asígnale un precio en Menú para ver el margen.</p>`;
                } else {
                    contenidoHTML += `<p style="color:var(--color-text-muted); font-size:0.85em;">Vincula esta receta a un producto de venta para ver el margen.</p>`;
                }
            }
        }

        contenidoHTML += '<h4>Pasos:</h4><ol>';
        const pasosArray = receta.pasos ? receta.pasos.split(/\.\s*|\n/).filter(p => p.trim()) : [];
        if (pasosArray.length > 0) {
            pasosArray.forEach(paso => { contenidoHTML += `<li>${paso}</li>`; });
        } else {
            contenidoHTML += '<li>No hay pasos registrados.</li>';
        }
        contenidoHTML += '</ol>';
        detalleContenido.innerHTML = contenidoHTML;
    };

    // --- 6. EVENT LISTENERS ---
    
    // Abrir modal para crear
    btnAgregarReceta.addEventListener('click', () => {
        modalTitulo.textContent = 'Agregar Receta';
        formReceta.reset();
        recetaIdInput.value = '';
        tempIngredientes = [];
        tempPasos = [];
        renderTempItems();
        productoVentaSelect.value = '';
        abrirModal(modalReceta);
    });

    // Clicks en la tabla (Editar, Eliminar, Ver Detalles)
    tablaBody.addEventListener('click', async (e) => {
        const target = e.target;
        const fila = target.closest('tr');
        if (!fila) return;

        const id = fila.dataset.recetaId;

        if (target.classList.contains('btn-edit')) {
            const receta = recetas.find(r => r.id == id);
            const productoVinculado = productosVenta.find(p => p.receta_id == id);
            
            modalTitulo.textContent = 'Editar Receta';
            recetaIdInput.value = receta.id;
            recetaNombreInput.value = receta.nombre;
            recetaDescInput.value = receta.descripcion;
            productoVentaSelect.value = productoVinculado ? productoVinculado.id : '';
            
            tempPasos = receta.pasos ? receta.pasos.split(/\.\s*|\n/).filter(p => p.trim()) : [];
            tempIngredientes = receta.ingredientes && receta.ingredientes[0].insumo_id ? receta.ingredientes.map(ing => ({
                insumo_id: ing.insumo_id,
                cantidad_necesaria: ing.cantidad_necesaria,
                unidad_medida: ing.unidad_medida,
            })) : [];
            
            renderTempItems();
            abrirModal(modalReceta);
        } else if (target.classList.contains('btn-eliminar')) {
            const receta = recetas.find(r => r.id == id);
            const ok = await DS.confirm(`¿Seguro que deseas eliminar la receta "${receta.nombre}"?`, { title: 'Eliminar receta', confirmText: 'Eliminar', danger: true });
            if (ok) eliminarReceta(id);
        } else {
            mostrarDetalles(id);
        }
    });

    // Agregar ingrediente a la lista temporal
    btnAgregarIngrediente.addEventListener('click', () => {
        const insumoId = selectInsumo.value;
        const cantidad = parseFloat(cantidadNecesariaInput.value);
        const unidad = unidadMedidaInput.value.trim();

        if (!insumoId || isNaN(cantidad) || cantidad <= 0 || !unidad) {
            DS.toast('Por favor, selecciona un insumo, ingresa una cantidad válida y una unidad.', { type: 'warning' });
            return;
        }
        tempIngredientes.push({ insumo_id: insumoId, cantidad_necesaria: cantidad, unidad_medida: unidad });
        renderTempItems();
        cantidadNecesariaInput.value = '';
        unidadMedidaInput.value = '';
        selectInsumo.value = '';
    });

    // Agregar paso a la lista temporal
    btnAgregarPaso.addEventListener('click', () => {
        const paso = pasoDescripcionTextarea.value.trim();
        if (paso) {
            tempPasos.push(paso);
            renderTempItems();
            pasoDescripcionTextarea.value = '';
        }
    });

    // Eliminar items temporales de las listas
    listaIngredientes.addEventListener('click', (e) => {
        if (e.target.classList.contains('remove-item')) {
            tempIngredientes.splice(e.target.dataset.index, 1);
            renderTempItems();
        }
    });
    listaPasos.addEventListener('click', (e) => {
        if (e.target.classList.contains('remove-item')) {
            tempPasos.splice(e.target.dataset.index, 1);
            renderTempItems();
        }
    });

    // ** Listener principal para guardar (Crear o Editar) **
    formReceta.addEventListener('submit', (e) => {
        e.preventDefault();
        const id = recetaIdInput.value;
        if (tempIngredientes.length === 0) {
            DS.toast('La receta debe tener al menos un ingrediente.', { type: 'warning' });
            return;
        }
        const recetaData = {
            nombre: recetaNombreInput.value.trim(),
            descripcion: recetaDescInput.value.trim(),
            pasos: tempPasos.join('.\n'),
            ingredientes: tempIngredientes,
            producto_venta_id: productoVentaSelect.value || null
        };
        guardarReceta(recetaData, id);
    });

    // Listeners generales
    btnLogout.addEventListener('click', cerrarSesion);
    document.querySelectorAll('.close, .btn-cancelar').forEach(el => el.addEventListener('click', cerrarModales));
    window.addEventListener('click', (e) => { if (e.target.classList.contains('modal')) cerrarModales(); });

    // --- 7. INICIALIZACIÓN ---
    const init = async () => {
        await cargarDatosIniciales();
        await renderRecetas();
    };
    init();
});
</script>
</body>
</html>
