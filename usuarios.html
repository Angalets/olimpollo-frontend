<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Olimpollo - Gestor de Usuarios</title>
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--color-surface); padding: 15px 40px; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); }
        header .logo { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-decoration: none; color: var(--color-text); }
        header nav { display: flex; gap: 20px; }
        header nav a { text-decoration: none; color: var(--color-text-muted); font-weight: 600; font-size: 14px; transition: color 0.2s; }
        header nav a:hover { color: var(--color-brand); }
        .user-info { display: flex; align-items: center; gap: 16px; }
        #user-identifier { font-weight: 600; background: var(--color-surface-alt); padding: 5px 12px; border-radius: var(--radius-full); font-size: 13px; }

        main { flex: 1; padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .page-title { margin-bottom: 30px; font-size: 26px; }
        table { width: 100%; border-collapse: collapse; background: var(--color-surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
        th, td { padding: 14px 15px; text-align: left; border-bottom: 1px solid var(--color-border); }
        th { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--color-text-muted); background: var(--color-surface-alt); }
        tr:hover td { background: var(--color-brand-tint); }
        footer { text-align: center; padding: 20px; font-size: 13px; color: var(--color-text-muted); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 17, 21, 0.6); justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--color-surface); color: var(--color-text); padding: 28px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 90%; max-width: 480px; position: relative; }
        .modal-content .close { position: absolute; top: 16px; right: 18px; font-size: 22px; cursor: pointer; color: var(--color-text-muted); background: none; border: none; }
        .modal-content .close:hover { color: var(--color-text); }

        /* Estilos específicos para esta página */
        .action-bar { margin-bottom: 25px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Olimpollo</a>
        <nav>
            <a href="pedidos.html">POS</a>
            <a href="reportes.html">Reportes</a>
            <a href="pedidos_lista.html">Pedidos</a>
            <a href="inventario.html">Inventario</a>
        </nav>
        <div class="user-info">
            <span id="user-identifier"></span>
            <button class="btn btn-secondary btn-sm" id="btn-logout">Cerrar Sesión</button>
        </div>
    </header>

    <main>
        <h2 class="page-title ds-display">Gestión de Usuarios</h2>
        <div class="action-bar">
            <button class="btn btn-primary" id="btn-agregar-usuario"><i class="fas fa-plus"></i> Agregar Nuevo Usuario</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-usuarios-body"></tbody>
        </table>
    </main>

    <div id="modalUsuario" class="modal">
        <div class="modal-content">
            <button type="button" class="close">&times;</button>
            <h3>Agregar Nuevo Usuario</h3>
            <form id="form-agregar" style="margin-top: 20px; display: grid; gap: 15px;">
                <div>
                    <label for="username-agregar">Usuario:</label>
                    <input type="text" id="username-agregar" class="input" required>
                </div>
                <div>
                    <label for="password-agregar">Contraseña:</label>
                    <input type="password" id="password-agregar" class="input" required>
                </div>
                <div>
                    <label for="rol-agregar">Rol:</label>
                    <select id="rol-agregar" class="select" required>
                        <option value="Empleado">Empleado</option>
                        <option value="Gerente">Gerente</option>
                        <option value="Administrador">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Crear Usuario</button>
            </form>
        </div>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <button type="button" class="close">&times;</button>
            <h3>Editar Usuario</h3>
            <form id="form-editar" style="margin-top: 20px; display: grid; gap: 15px;">
                <div>
                    <label>Usuario:</label>
                    <input type="text" id="username-editar" class="input" disabled>
                </div>
                <div>
                    <label for="password-editar">Nueva Contraseña (dejar en blanco para no cambiarla):</label>
                    <input type="password" id="password-editar" class="input">
                </div>
                <div>
                    <label for="rol-editar">Rol:</label>
                    <select id="rol-editar" class="select" required>
                        <option value="Empleado">Empleado</option>
                        <option value="Gerente">Gerente</option>
                        <option value="Administrador">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <footer>&copy; 2026 Los Boneless del Olimpo</footer>

    <script src="design-system.js"></script>
    <script>
        (function() {
            const originalFetch = window.fetch;
            window.fetch = async function(...args) {
                const response = await originalFetch(...args);
                if (response.status === 401) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('userRole');
                    if (!location.pathname.endsWith('login.html')) window.location.href = 'login.html';
                }
                return response;
            };
        })();
        // Función para decodificar JWT
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 🚨 CORRECCIÓN AQUÍ: Añadido el endpoint /api/usuarios
            const API_URL = 'https://olimpollo-api.onrender.com/api/usuarios';
            const tablaBody = document.getElementById('tabla-usuarios-body');
            const modalUsuario = document.getElementById('modalUsuario');
            const modalEditar = document.getElementById('modalEditar');
            const formAgregar = document.getElementById('form-agregar');
            const formEditar = document.getElementById('form-editar');
            let usuarioIdActual = null;

            // --- 1. Control de Acceso y Sesión ---
            const token = localStorage.getItem('authToken');
            const role = localStorage.getItem('userRole');
            if (!token || role !== 'Administrador') {
                DS.notice('Acceso denegado. Solo Administradores.', { title: 'Acceso denegado' }).then(() => { window.location.href = 'index.html'; });
                return;
            }
            
            const userData = parseJwt(token);
            if (userData && userData.username) {
                document.getElementById('user-identifier').textContent = userData.username;
            }
            
            document.getElementById('btn-logout').addEventListener('click', () => { 
                localStorage.removeItem('authToken');
                localStorage.removeItem('userRole');
                window.location.href = 'login.html'; 
            });

            // --- 2. Funciones de Renderizado y FETCH ---
            const fetchUsuarios = async () => {
                try {
                    const response = await fetch(API_URL, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (!response.ok) throw new Error('Error al cargar los usuarios');
                    const usuarios = await response.json();
                    renderUsuarios(usuarios);
                } catch (error) {
                    console.error('Error:', error);
                    DS.toast('No se pudo cargar la lista de usuarios.', { type: 'error', duration: 0 });
                }
            };

            const renderUsuarios = (usuarios) => {
                tablaBody.innerHTML = '';
                usuarios.forEach(usuario => {
                    const row = tablaBody.insertRow();
                    row.innerHTML = `
                        <td>${usuario.id}</td>
                        <td>${usuario.username}</td>
                        <td>${usuario.rol}</td>
                        <td style="display:flex; gap:8px;">
                            <button type="button" class="btn btn-secondary btn-sm btn-editar" data-id="${usuario.id}" data-username="${usuario.username}" data-rol="${usuario.rol}">Editar</button>
                            <button type="button" class="btn btn-danger-outline btn-sm btn-eliminar" data-id="${usuario.id}" data-username="${usuario.username}">Eliminar</button>
                        </td>
                    `;
                });
            };

            // --- 3. Lógica para Agregar Usuario (POST) ---
            document.getElementById('btn-agregar-usuario').addEventListener('click', () => {
                modalUsuario.style.display = 'flex';
                formAgregar.reset();
            });

            formAgregar.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username-agregar').value.trim();
                const password = document.getElementById('password-agregar').value;
                const rol = document.getElementById('rol-agregar').value;
                
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ username, password, rol })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Error al crear el usuario.');

                    DS.toast(`Usuario ${username} creado exitosamente.`, { type: 'success' });
                    cerrarModales();
                    fetchUsuarios();
                } catch (error) {
                    console.error('Error:', error);
                    DS.toast('Error al crear el usuario: ' + error.message, { type: 'error', duration: 0 });
                }
            });

            // --- 4. Lógica para Editar Usuario (PUT) ---
            tablaBody.addEventListener('click', (e) => {
                if (e.target.classList.contains('btn-editar')) {
                    usuarioIdActual = e.target.dataset.id;
                    formEditar.reset();
                    document.getElementById('username-editar').value = e.target.dataset.username;
                    document.getElementById('rol-editar').value = e.target.dataset.rol;
                    modalEditar.style.display = 'flex';
                }
            });

            formEditar.addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = document.getElementById('password-editar').value;
                const rol = document.getElementById('rol-editar').value;
                const body = { rol };
                if (password) body.password = password;

                try {
                    const response = await fetch(`${API_URL}/${usuarioIdActual}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(body)
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Error al editar el usuario.');

                    DS.toast(`Usuario ${data.username} actualizado exitosamente.`, { type: 'success' });
                    cerrarModales();
                    fetchUsuarios();
                } catch (error) {
                    console.error('Error:', error);
                    DS.toast('Error al editar el usuario: ' + error.message, { type: 'error', duration: 0 });
                }
            });

            // --- 5. Lógica para Eliminar Usuario (DELETE) ---
            tablaBody.addEventListener('click', async (e) => {
                if (e.target.classList.contains('btn-eliminar')) {
                    const id = e.target.dataset.id;
                    const username = e.target.dataset.username;
                    const ok = await DS.confirm(`¿Está seguro de eliminar a "${username}" (ID: ${id})?`, { title: 'Eliminar usuario', confirmText: 'Eliminar', danger: true });
                    if (!ok) return;
                    try {
                        const response = await fetch(`${API_URL}/${id}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (response.status === 403) {
                            const data = await response.json();
                            throw new Error(data.error);
                        }
                        if (!response.ok) throw new Error('Error al eliminar el usuario.');

                        DS.toast(`Usuario "${username}" eliminado exitosamente.`, { type: 'success' });
                        fetchUsuarios();
                    } catch (error) {
                        console.error('Error:', error);
                        DS.toast('Error al eliminar: ' + error.message, { type: 'error', duration: 0 });
                    }
                }
            });

            // --- 6. Lógica de Modales ---
            const cerrarModales = () => {
                modalUsuario.style.display = 'none';
                modalEditar.style.display = 'none';
            };
            document.querySelectorAll('.close, .btn-cancelar').forEach(el => el.addEventListener('click', cerrarModales));
            window.addEventListener('click', (e) => {
                if (e.target.classList.contains('modal')) cerrarModales();
            });

            // --- 7. INICIALIZACIÓN ---
            fetchUsuarios();
        });
    </script>
</body>
</html>
