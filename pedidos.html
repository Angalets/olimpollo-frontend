<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Profesional - Olimpollo</title>
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ==========================================================================
           DISEÑO POS (3 COLUMNAS + IMÁGENES) — usa los tokens de design-system.css
           ========================================================================== */
        :root { --chrome-bg: #111827; }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER (Top Bar) — barra oscura fija, independiente del tema claro/oscuro */
        header { background: var(--chrome-bg); color: #fff; padding: 0 20px; height: 65px; display: flex; justify-content: space-between; align-items: center; z-index: 50; flex-shrink: 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .logo { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px;}
        .nav-links { display: flex; gap: 16px; margin-left: 24px; }
        .nav-links a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; font-weight: 600; }
        .nav-links a:hover { color: #fff; }
        .pos-tools { display: flex; gap: 10px; align-items: center; }
        .btn-tool { background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 15px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; display: flex; align-items: center; gap: 6px;}
        .btn-tool:hover { background: rgba(255,255,255,0.2); }
        .btn-intercom { background: var(--color-warning); color: #fff; }
        .user-badge { font-size: 13px; font-weight: 600; background: var(--color-brand); padding: 5px 12px; border-radius: var(--radius-full); margin-left: 15px;}

        /* MAIN LAYOUT (3 COLUMNAS) */
        main { display: flex; flex: 1; height: calc(100vh - 65px); overflow: hidden; }

        /* COLUMNA 1: CATEGORÍAS (Izquierda) */
        .sidebar-cats { width: 140px; background: var(--color-surface); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; padding: 10px 0; }
        .sidebar-cats::-webkit-scrollbar { display: none; }
        .btn-category { background: transparent; border: none; border-left: 4px solid transparent; padding: 20px 10px; text-align: center; color: var(--color-text-muted); font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 8px; align-items: center;}
        .btn-category i { font-size: 24px; }
        .btn-category.active { background: var(--color-brand-tint); border-left-color: var(--color-brand); color: var(--color-brand); }

        /* COLUMNA 2: PRODUCTOS (Centro) */
        .menu-area { flex: 1; overflow-y: auto; padding: 20px; background: var(--color-bg); scroll-behavior: smooth;}
        .menu-area::-webkit-scrollbar { width: 8px; }
        .menu-area::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }

        .section-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--color-text); margin: 25px 0 15px 0; display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ""; flex: 1; height: 2px; background: var(--color-border); margin-left: 10px; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }

        /* TARJETA DE PRODUCTO CON IMAGEN */
        .product-card { background: var(--color-surface); border: 2px solid transparent; border-radius: var(--radius-md); cursor: pointer; overflow: hidden; display: flex; flex-direction: column; height: 200px; box-shadow: var(--shadow-sm); transition: transform 0.1s, box-shadow 0.2s; position: relative; }
        .product-card:active { transform: scale(0.96); }
        .product-card.has-mods { border-color: var(--color-brand); }
        .product-card.has-mods::after { content: 'MODS'; position: absolute; top: 10px; right: 10px; background: var(--color-brand); color: white; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: var(--radius-full); box-shadow: var(--shadow-sm);}

        .prod-img { height: 110px; background-color: var(--color-surface-alt); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; font-size: 40px; color: var(--color-text-muted); }
        .prod-info { padding: 12px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
        .prod-name { font-size: 14px; font-weight: 700; color: var(--color-text); line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        .prod-price { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--color-success); margin-top: auto; }

        /* COLUMNA 3: TICKET (Derecha) */
        .ticket-panel { width: 380px; background: var(--color-surface); display: flex; flex-direction: column; flex-shrink: 0; box-shadow: var(--shadow-md); z-index: 10; border-left: 1px solid var(--color-border);}

        /* Info Cliente */
        .ticket-header { padding: 15px; border-bottom: 1px solid var(--color-border); background: var(--color-surface-alt); }
        .search-crm { display: flex; gap: 5px; margin-bottom: 8px; }
        .input-crm { flex: 1; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 14px; outline: none; background: var(--color-surface); color: var(--color-text);}
        .input-crm:focus { border-color: var(--color-brand); }
        .btn-search { background: var(--color-text); color: var(--color-surface); border: none; padding: 0 15px; border-radius: var(--radius-sm); cursor: pointer; }

        /* Carrito */
        .ticket-items { flex: 1; overflow-y: auto; padding: 15px 10px; }
        .ticket-items::-webkit-scrollbar { width: 4px; }
        .ticket-items::-webkit-scrollbar-thumb { background: var(--color-border); }
        .empty-cart { text-align: center; color: var(--color-text-muted); margin-top: 60px; font-weight: 600; font-size: 20px;}
        .empty-cart i { font-size: 50px; margin-bottom: 15px; display: block; }

        .cart-item { padding: 12px 10px; border-bottom: 1px dashed var(--color-border); display: flex; flex-direction: column; gap: 8px;}
        .cart-item-main { display: flex; justify-content: space-between; align-items: flex-start; }
        .item-details { flex: 1; padding-right: 10px; }
        .item-name { font-weight: 700; font-size: 14px; color: var(--color-text); }
        .item-mods { font-size: 11px; color: var(--color-text-muted); display: block; margin-top: 2px; }
        .item-note { font-size: 11px; color: var(--color-warning); font-weight: 600; display: block; }
        .item-price { font-weight: 800; font-size: 15px; color: var(--color-text); }

        .item-actions { display: flex; justify-content: space-between; align-items: center; }
        .qty-control { display: flex; align-items: center; background: var(--color-bg); border-radius: var(--radius-full); border: 1px solid var(--color-border);}
        .btn-qty { background: transparent; border: none; width: 32px; height: 32px; font-size: 16px; font-weight: bold; cursor: pointer; color: var(--color-text); }
        .qty-num { width: 25px; text-align: center; font-weight: 700; font-size: 14px; color: var(--color-text); }
        .btn-text-action { background: transparent; border: none; color: var(--color-brand); font-size: 12px; font-weight: 700; cursor: pointer; }

        /* Checkout y Totales */
        .ticket-checkout { padding: 15px; border-top: 1px solid var(--color-border); background: var(--color-surface-alt); }
        .checkout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .btn-select { background: var(--color-surface); border: 1px solid var(--color-border); padding: 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; color: var(--color-text-muted); cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; transition: 0.2s;}
        .btn-select.active { background: var(--color-brand-tint); border-color: var(--color-brand); color: var(--color-brand); }

        .totals-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; margin-top: 10px;}
        .total-label { font-size: 16px; font-weight: 800; color: var(--color-text-muted); }
        .total-amount { font-family: var(--font-display); font-size: 34px; font-weight: 700; color: var(--color-text); line-height: 1; letter-spacing: -1px;}

        .btn-pay { width: 100%; background: var(--color-success); color: white; border: none; padding: 20px; border-radius: var(--radius-md); font-family: var(--font-display); font-size: 22px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .btn-pay:active { transform: scale(0.98); }

        /* Banner de Edición */
        #edit-banner { display: none; background: var(--color-warning); color: white; text-align: center; padding: 8px; font-weight: bold; font-size: 13px; z-index: 60;}
        #mesa-banner { display: none; background: var(--color-info); color: white; text-align: center; padding: 8px; font-weight: bold; font-size: 13px; z-index: 60;}

        /* Modales */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 17, 21, 0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; }
        .modal-content { background: var(--color-surface); color: var(--color-text); padding: 25px; border-radius: var(--radius-lg); width: 90%; max-width: 450px; position: relative; box-shadow: var(--shadow-lg);}
        .modal-content .close { position: absolute; top: 14px; right: 16px; font-size: 22px; line-height: 1; color: var(--color-text-muted); cursor: pointer; background: none; border: none; }
        .modal-content .close:hover { color: var(--color-text); }
        .opt-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .btn-opt { background: var(--color-surface-alt); border: 2px solid transparent; padding: 15px; border-radius: var(--radius-md); font-weight: 700; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--color-text);}
        .btn-opt.active { background: var(--color-brand-tint); border-color: var(--color-brand); color: var(--color-brand); }

        /* Grupos de modificadores como chips (reemplaza el flujo de un modal por grupo) */
        .mod-group { margin-bottom: 18px; }
        .mod-group-label { font-size: 12px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 8px; display: block; }
        .mod-group-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    </style>
    <script src="pos-common.js"></script>
    <script src="design-system.js"></script>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html" class="logo"><i class="fas fa-gem"></i> POS Pro</a>
            <nav class="nav-links">
                <a href="mesas.html">Mesas</a>
                <a href="pedidos_lista.html">Historial</a>
                <a href="clientes.html">CRM</a>
            </nav>
        </div>
        <div class="pos-tools">
            <button class="btn-tool" onclick="abrirCajon()"><i class="fas fa-cash-register"></i> Abrir Cajón</button>
            <button class="btn-tool" onclick="verPausadas()"><i class="fas fa-pause-circle"></i> Órdenes en Espera</button>
            <button class="btn-tool btn-intercom" id="btn-abrir-intercom"><i class="fas fa-bullhorn"></i> Alerta a Cocina</button>
            <span class="user-badge" id="user-identifier">Cajero</span>
            <button class="btn-tool" id="btn-logout" style="margin-left: 5px;"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <div id="edit-banner">⚠️ MODO EDICIÓN: Modificando Pedido <span id="edit-id-label"></span> <button style="background: rgba(0,0,0,0.3); color:white; border:none; padding:4px 8px; border-radius:4px; margin-left:10px; cursor:pointer;" onclick="cancelarEdicion()">Cancelar</button></div>
    <div id="mesa-banner">🪑 Nuevo pedido para <span id="mesa-nombre-label"></span></div>

    <main>
        <div class="sidebar-cats" id="category-container">
            <button class="btn-category active" data-cat="Todos">
                <i class="fas fa-border-all"></i>
                Todos
            </button>
            </div>

        <div class="menu-area" id="menu-area">
            <div id="productos-container">
                <p style="text-align:center; padding: 40px; font-weight: bold; color: var(--color-text-muted);">Cargando menú...</p>
            </div>
        </div>

        <div class="ticket-panel">
            <div class="ticket-header">
                <div class="search-crm">
                    <input type="tel" id="cliente-telefono" class="input-crm" placeholder="Teléfono (Opcional)">
                    <button type="button" id="btn-buscar-cliente" class="btn-search"><i class="fas fa-search"></i></button>
                </div>
                <div id="info-cliente-crm" style="font-size: 11px; margin-bottom: 8px; display: none; font-weight: 700;"></div>
                <input type="text" id="cliente-nombre" class="input-crm" placeholder="Nombre o Mesa *" required style="width: 100%; border-color: var(--color-brand); background: var(--color-brand-tint);">
            </div>

            <div class="ticket-items" id="lista-carrito">
                </div>

            <div class="ticket-checkout">
                <div class="checkout-grid">
                    <button type="button" class="btn-select btn-tipo active" data-tipo="Para Llevar"><i class="fas fa-shopping-bag"></i> Llevar</button>
                    <button type="button" class="btn-select btn-tipo" data-tipo="Comedor"><i class="fas fa-utensils"></i> Comedor</button>
                    <button type="button" class="btn-select" id="btn-select-canal"><i class="fas fa-store"></i> OyR</button>
                    <button type="button" class="btn-select" id="btn-select-pago"><i class="fas fa-money-bill-wave"></i> Efectivo</button>
                </div>

                <div id="panel-pago-mixto" style="display:none; background:#FFF7E6; border:1px solid #F0C36D; border-radius:8px; padding:10px; margin-bottom:10px;">
                    <div style="font-size:10px; font-weight:800; color:var(--color-text-muted); margin-bottom:6px;">PAGO MIXTO</div>
                    <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">
                        <label style="font-size:11px; flex-shrink:0; width:60px;">Efectivo:</label>
                        <input type="number" id="mixto-efectivo" class="input-crm" placeholder="0.00" step="0.01" style="flex:1;">
                    </div>
                    <div style="display:flex; gap:8px; align-items:center; justify-content:space-between;">
                        <button type="button" class="btn-select" id="btn-select-pago-secundario" style="flex-shrink:0; font-size:12px; padding:6px 10px;">Tarjeta</button>
                        <span style="font-size:12px; font-weight:700;">Resto: <span id="mixto-resto">$0.00</span></span>
                    </div>
                </div>

                <div class="checkout-grid">
                    <div>
                        <label style="font-size: 10px; font-weight: 800; color: var(--color-text-muted);">AJUSTE MANUAL ($)</label>
                        <input type="number" id="ajuste-total" class="input-crm" placeholder="Opcional" step="0.01" style="width:100%; margin-top:2px;">
                    </div>
                    <div>
                        <label style="font-size: 10px; font-weight: 800; color: var(--color-text-muted);">DESCUENTO</label>
                        <select id="select-descuento" class="input-crm" style="width:100%; margin-top:2px;">
                            <option value="0">Ninguno (0%)</option>
                            <option value="10">10% OFF</option>
                            <option value="20">20% OFF</option>
                            <option value="50">50% OFF</option>
                            <option value="100">100% (Cortesía)</option>
                        </select>
                    </div>
                </div>

                <div style="margin-bottom: 10px;">
                    <label style="font-size: 10px; font-weight: 800; color: var(--color-text-muted);">PROPINA ($, aparte del total)</label>
                    <input type="number" id="input-propina" class="input-crm" placeholder="0.00" step="0.01" style="width:100%; margin-top:2px;">
                </div>

                <div id="info-comision" style="font-size: 11px; font-weight: 700; color: var(--color-brand); text-align: right; margin-top: 5px; display: none;"></div>

                <div class="totals-row">
                    <span class="total-label">COBRAR</span>
                    <span class="total-amount" id="total-pedido">$0.00</span>
                </div>
                
                <div style="display:flex; gap:10px;">
                    <button class="btn-tool" style="background:var(--color-text); color:var(--color-bg); flex-shrink:0;" title="Pausar Orden" onclick="pausarOrden()"><i class="fas fa-pause"></i></button>
                    <button class="btn-pay" id="btn-cobrar"><i class="fas fa-check-circle"></i> PAGAR</button>
                </div>
            </div>
        </div>
    </main>

    <div id="modalSelector" class="modal">
        <div class="modal-content">
            <h3 id="selector-title" style="margin-bottom: 5px;">Seleccionar</h3>
            <div class="opt-grid" id="selector-options"></div>
        </div>
    </div>

    <div id="modalModificadores" class="modal">
        <div class="modal-content">
            <h3 id="modal-mod-titulo" style="margin-bottom: 4px;">Opciones</h3>
            <p style="font-size: 13px; color: var(--color-text-muted); margin-bottom: 18px;">Toca para elegir cada modificador.</p>
            <div id="modal-mod-grupos"></div>
            <div style="display:flex; gap:10px; margin-top: 10px;">
                <button id="btn-cancelar-mod" class="btn btn-secondary" style="flex:1;">Cancelar</button>
                <button id="btn-agregar-mod" class="btn btn-primary" style="flex:1;">Agregar</button>
            </div>
        </div>
    </div>

    <div id="modalIntercom" class="modal">
        <div class="modal-content">
            <span class="close" id="close-intercom">&times;</span>
            <h3 style="color: var(--color-warning); margin-bottom: 5px;"><i class="fas fa-bullhorn"></i> Alerta a Cocina</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0;">
                <button class="btn-opt btn-quick-alert">🗑️ Basura</button>
                <button class="btn-opt btn-quick-alert">🧻 Servilletas</button>
                <button class="btn-opt btn-quick-alert">🧹 Limpiar</button>
                <button class="btn-opt btn-quick-alert">🚶‍♂️ Venir a Caja</button>
            </div>
            <input type="text" id="input-alerta" class="input-crm" placeholder="Mensaje personalizado..." style="margin-bottom: 15px; width: 100%;">
            <button id="btn-enviar-alerta" class="btn-pay" style="padding: 15px; font-size:18px;">Enviar Alerta</button>
        </div>
    </div>

    <div id="modalPausadas" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close" onclick="document.getElementById('modalPausadas').style.display='none'">&times;</span>
            <h3 style="margin-bottom: 15px;"><i class="fas fa-pause-circle"></i> Órdenes en Espera</h3>
            <div id="lista-pausadas" style="max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                </div>
        </div>
    </div>

    <script>
        (function() {
            const originalFetch = window.fetch;
            window.fetch = async function(...args) {
                const response = await originalFetch(...args);
                if (response.status === 401) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('userRole');
                    if (!location.pathname.endsWith('login.html')) window.location.href = 'login.html';
                }
                return response;
            };
        })();
        function parseJwt(t) { try { return JSON.parse(decodeURIComponent(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))); } catch(e) { return null; } }

        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE = 'https://olimpollo-api.onrender.com/api';
            
            let menuData = { productos: [], opciones: {} };
            let carrito = [];
            let selectedCanal = 'OyR', selectedPago = 'Efectivo', selectedTipo = 'Para Llevar';
            let selectedPagoSecundario = 'Tarjeta';
            let editModeId = null;
            let mesaIdActual = null;

            // DOM Elements
            const menuArea = document.getElementById('menu-area');
            const categoryContainer = document.getElementById('category-container');
            const listaCarrito = document.getElementById('lista-carrito');
            const totalPedidoSpan = document.getElementById('total-pedido');
            const inputAjusteTotal = document.getElementById('ajuste-total');
            const selectDescuento = document.getElementById('select-descuento');
            const inputPropina = document.getElementById('input-propina');
            const panelPagoMixto = document.getElementById('panel-pago-mixto');
            const inputMixtoEfectivo = document.getElementById('mixto-efectivo');
            const mixtoRestoSpan = document.getElementById('mixto-resto');
            const btnCobrar = document.getElementById('btn-cobrar');
            const infoComision = document.getElementById('info-comision');
            const inputTelefono = document.getElementById('cliente-telefono');
            const btnBuscarCliente = document.getElementById('btn-buscar-cliente');
            const inputClienteNombre = document.getElementById('cliente-nombre');
            const infoClienteCRM = document.getElementById('info-cliente-crm');

            // --- 1. AUTH ---
            const token = localStorage.getItem('authToken'); 
            if(token) { const u = parseJwt(token); if(u) document.getElementById('user-identifier').textContent = u.username; } 
            else { window.location.href = 'login.html'; }
            document.getElementById('btn-logout').addEventListener('click', () => { localStorage.clear(); window.location.href='login.html'; });

            // --- 2. INIT & EDIT MODE ---
            let pedidoRequestIdPendiente = null;

            const init = async () => {
                try {
                    const res = await fetchConReintento(`${API_BASE}/menu/pos`, { headers: { 'Authorization': `Bearer ${token}` } }, {
                        onReintento: (intento, ms) => mostrarEstadoConexion(`🔌 Sin conexión, reintentando cargar el menú (${Math.floor(ms/1000)}s)...`)
                    });
                    ocultarEstadoConexion();
                    menuData = await res.json();
                    renderCategorias();
                    renderMenuCompleto('Todos');

                    const editData = localStorage.getItem('editPedidoData');
                    if (editData) {
                        const p = JSON.parse(editData);
                        editModeId = p.id;
                        document.getElementById('edit-banner').style.display = 'block';
                        document.getElementById('edit-id-label').textContent = `#${p.id}`;
                        btnCobrar.innerHTML = '<i class="fas fa-save"></i> ACTUALIZAR';
                        btnCobrar.style.background = 'var(--color-warning)';

                        inputClienteNombre.value = p.cliente;
                        selectedCanal = p.canal_venta || 'OyR';
                        selectedPago = p.metodo_pago || 'Efectivo';
                        selectedTipo = p.tipo_consumo || 'Para Llevar';
                        selectDescuento.value = p.descuento || 0;
                        inputPropina.value = p.propina || '';
                        document.getElementById('btn-select-canal').innerHTML = `<i class="fas fa-store"></i> ${selectedCanal}`;
                        document.getElementById('btn-select-pago').innerHTML = `<i class="fas fa-money-bill"></i> ${selectedPago}`;
                        document.querySelectorAll('.btn-tipo').forEach(b => { b.classList.remove('active'); if(b.dataset.tipo === selectedTipo) b.classList.add('active'); });

                        if (selectedPago === 'Mixto') {
                            selectedPagoSecundario = p.metodo_pago_secundario || 'Tarjeta';
                            document.getElementById('btn-select-pago-secundario').textContent = selectedPagoSecundario;
                            inputMixtoEfectivo.value = p.monto_efectivo || '';
                            panelPagoMixto.style.display = 'block';
                        }

                        carrito = p.items.map(i => {
                            const match = i.nombre_producto.match(/(.*)\s\((.*)\)/);
                            return { id: i.menu_producto_id, nombre: match ? match[1].trim() : i.nombre_producto, precio: i.precio_unitario, cantidad: i.cantidad, mods: match ? match[2] : '', notas: i.notas || '' };
                        });
                        localStorage.removeItem('editPedidoData');
                        renderCarrito();
                    } else {
                        const urlParams = new URLSearchParams(window.location.search);
                        const mesaId = urlParams.get('mesa_id');
                        const mesaNombre = urlParams.get('mesa_nombre');
                        if (mesaId && mesaNombre) {
                            mesaIdActual = mesaId;
                            inputClienteNombre.value = mesaNombre;
                            selectedTipo = 'Comedor';
                            document.querySelectorAll('.btn-tipo').forEach(b => { b.classList.remove('active'); if(b.dataset.tipo === 'Comedor') b.classList.add('active'); });
                            document.getElementById('mesa-nombre-label').textContent = mesaNombre;
                            document.getElementById('mesa-banner').style.display = 'block';
                        }
                    }
                } catch (e) { ocultarEstadoConexion(); menuArea.innerHTML = `<p style="padding:20px; color:red;">${e.message || 'Error de red.'}</p>`; }
            };

            window.cancelarEdicion = () => { localStorage.removeItem('editPedidoData'); window.location.href = 'pedidos_lista.html'; };

            // --- 3. UI LOGIC & SELECTORES ---
            document.querySelectorAll('.btn-tipo').forEach(btn => {
                btn.onclick = (e) => {
                    document.querySelectorAll('.btn-tipo').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    selectedTipo = e.currentTarget.dataset.tipo;
                };
            });

            selectDescuento.addEventListener('change', () => calcularTotal());
            inputAjusteTotal.addEventListener('input', () => calcularTotal());

            const modalSelector = document.getElementById('modalSelector');
            const openSelector = (t, opts, cur, cb) => { 
                document.getElementById('selector-title').textContent = t; 
                document.getElementById('selector-options').innerHTML = ''; 
                opts.forEach(o => { 
                    const b = document.createElement('button'); b.className = `btn-opt ${o===cur?'active':''}`; b.textContent = o; 
                    b.onclick = () => { cb(o); modalSelector.style.display = 'none'; }; 
                    document.getElementById('selector-options').appendChild(b); 
                }); 
                modalSelector.style.display = 'flex'; 
            };
            
            document.getElementById('btn-select-canal').onclick = () => openSelector('Canal', ['OyR', 'Uber', 'Didi', 'Rappi', 'Empleado'], selectedCanal, (v) => { selectedCanal = v; document.getElementById('btn-select-canal').innerHTML = `<i class="fas fa-store"></i> ${v}`; calcularTotal(); });
            document.getElementById('btn-select-pago').onclick = () => openSelector('Pago', ['Efectivo', 'Tarjeta', 'Transferencia', 'Aplicación', 'Mixto'], selectedPago, (v) => {
                selectedPago = v;
                document.getElementById('btn-select-pago').innerHTML = `<i class="fas fa-money-bill"></i> ${v}`;
                panelPagoMixto.style.display = v === 'Mixto' ? 'block' : 'none';
                calcularTotal();
            });
            document.getElementById('btn-select-pago-secundario').onclick = () => openSelector('Método secundario', ['Tarjeta', 'Transferencia', 'Aplicación'], selectedPagoSecundario, (v) => {
                selectedPagoSecundario = v;
                document.getElementById('btn-select-pago-secundario').textContent = v;
                calcularTotal();
            });
            inputMixtoEfectivo.addEventListener('input', () => calcularTotal());

            window.addEventListener('click', (e) => { if(e.target===modalSelector) modalSelector.style.display='none'; if(e.target===document.getElementById('modalIntercom')) document.getElementById('modalIntercom').style.display='none';});

            // CRM Buscar
            btnBuscarCliente.addEventListener('click', async () => {
                const tel = inputTelefono.value.trim();
                if (tel.length < 7) return DS.toast('Número de teléfono inválido.', { type: 'warning' });
                try {
                    const res = await fetch(`${API_BASE}/clientes/exacto/${tel}`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (res.ok) {
                        const c = await res.json();
                        inputClienteNombre.value = c.nombre;
                        infoClienteCRM.style.display = 'block'; infoClienteCRM.style.color = 'var(--color-success)';
                        infoClienteCRM.innerHTML = `🌟 Frecuente | Visitas: ${c.visitas} | Puntos: ${c.puntos}`;
                    } else {
                        infoClienteCRM.style.display = 'block'; infoClienteCRM.style.color = 'var(--color-text-muted)';
                        infoClienteCRM.innerHTML = `🆕 Nuevo Cliente`; inputClienteNombre.focus();
                    }
                } catch (e) {}
            });

            // --- 4. RENDERIZADO VISUAL DEL MENÚ (REMODELACIÓN) ---
            const iconMap = { 'Bebidas': 'fa-glass-water', 'Sides': 'fa-french-fries', 'Platos Fuertes': 'fa-drumstick-bite', 'PROMOS': 'fa-fire', 'Aderezos': 'fa-pump-soap', 'default': 'fa-utensils' };
            const colorMap = { 'Bebidas': '#DBEAFE', 'Sides': '#FEF3C7', 'Platos Fuertes': '#FFEDD5', 'PROMOS': '#FEE2E2', 'Aderezos': '#F3F4F6', 'default': '#E2E8F0' };

            const renderCategorias = () => { 
                const cats = ['Todos', ...new Set(menuData.productos.map(p => p.categoria))]; 
                categoryContainer.innerHTML = ''; 
                cats.forEach(c => { 
                    const icon = c === 'Todos' ? 'fa-border-all' : (iconMap[c] || iconMap['default']);
                    const btn = document.createElement('button'); 
                    btn.className = `btn-category ${c==='Todos'?'active':''}`; 
                    btn.innerHTML = `<i class="fas ${icon}"></i> ${c}`; 
                    btn.onclick = () => { document.querySelectorAll('.btn-category').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); renderMenuCompleto(c); }; 
                    categoryContainer.appendChild(btn); 
                }); 
            };

            const crearTarjetaProducto = (p) => {
                const btn = document.createElement('div'); 
                btn.className = `product-card ${p.grupos_modificadores?'has-mods':''}`; 
                
                // Si tiene imagen_url la usamos, si no, usamos un fondo de color y un icono
                let bgContent = '';
                if (p.imagen_url) {
                    bgContent = `background-image: url('${p.imagen_url}');`;
                } else {
                    bgContent = `background-color: ${colorMap[p.categoria] || colorMap['default']};`;
                }

                const iconFallback = !p.imagen_url ? `<i class="fas ${iconMap[p.categoria] || iconMap['default']}"></i>` : '';

                btn.innerHTML = `
                    <div class="prod-img" style="${bgContent}">${iconFallback}</div>
                    <div class="prod-info">
                        <span class="prod-name">${p.nombre_venta}</span>
                        <span class="prod-price">$${p.precio_base.toFixed(2)}</span>
                    </div>
                `; 
                
                btn.onclick = async () => {
                    let mAcum=[], pExtra=0;
                    if(p.grupos_modificadores){
                        const gr=p.grupos_modificadores.split(',').map(g=>g.trim()).filter(Boolean);
                        const hayOpciones = gr.some(g => (menuData.opciones[g] || []).length > 0);
                        if (hayOpciones) {
                            try {
                                mAcum = await solicitarModificadores(p.nombre_venta, gr);
                                pExtra = mAcum.reduce((s, o) => s + o.precio_adicional, 0);
                            } catch (e) { return; }
                        }
                    }
                    const modStr=mAcum.map(x=>x.valor).join(', ');
                    const idx=carrito.findIndex(i=>i.id===p.id && i.mods===modStr && i.notas===''); 
                    if(idx>-1) carrito[idx].cantidad++; else carrito.push({id:p.id, nombre:p.nombre_venta, precio:p.precio_base+pExtra, cantidad:1, mods:modStr, notas:''}); 
                    renderCarrito(); 
                };
                return btn;
            };

            // Dibuja el menú con Títulos Separadores
            const renderMenuCompleto = (filtro) => {
                menuArea.innerHTML = '';
                const categoriasUnicas = [...new Set(menuData.productos.map(p => p.categoria))];
                
                const agregarSeccion = (nombreCat, prods) => {
                    const titulo = document.createElement('div');
                    titulo.className = 'section-title';
                    titulo.innerHTML = `<i class="fas ${iconMap[nombreCat]||iconMap['default']}"></i> ${nombreCat}`;
                    menuArea.appendChild(titulo);
                    const grid = document.createElement('div');
                    grid.className = 'products-grid';
                    prods.forEach(p => grid.appendChild(crearTarjetaProducto(p)));
                    menuArea.appendChild(grid);
                };

                if (filtro === 'Todos') {
                    categoriasUnicas.forEach(cat => {
                        const prods = menuData.productos.filter(p => p.categoria === cat);
                        if (prods.length > 0) agregarSeccion(cat, prods);
                    });
                } else {
                    agregarSeccion(filtro, menuData.productos.filter(p => p.categoria === filtro));
                }
            };
            
            // --- 5. CARRITO ---
            const renderCarrito = () => { 
                listaCarrito.innerHTML = ''; 
                if(carrito.length===0){ listaCarrito.innerHTML='<div class="empty-cart"><i class="fas fa-shopping-basket"></i>Ticket vacío</div>'; calcularTotal(); return; } 
                carrito.forEach((i,idx) => { 
                    listaCarrito.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-main">
                                <div class="item-details">
                                    <span class="item-name">${i.nombre}</span>
                                    <span class="item-mods">${i.mods}</span>
                                    <span class="item-note">${i.notas?'📝 '+i.notas:''}</span>
                                </div>
                                <div class="item-price">$${(i.precio*i.cantidad).toFixed(2)}</div>
                            </div>
                            <div class="item-actions">
                                <button class="btn-text-action" onclick="addNota(${idx})"><i class="fas fa-pen"></i> Nota</button>
                                <div class="qty-control">
                                    <button class="btn-qty" onclick="modQty(${idx},-1)">-</button>
                                    <div class="qty-num">${i.cantidad}</div>
                                    <button class="btn-qty" onclick="modQty(${idx},1)">+</button>
                                </div>
                            </div>
                        </div>`; 
                }); 
                calcularTotal(); 
            };
            
            window.modQty = (i, d) => { carrito[i].cantidad+=d; if(carrito[i].cantidad<=0) carrito.splice(i,1); renderCarrito(); };
            window.addNota = async (i) => { const n = await DS.prompt('Nota para cocina:', { title: 'Nota de cocina', defaultValue: carrito[i].notas }); if(n!==null){carrito[i].notas=n.trim(); renderCarrito();} };

            const TASA_COMISION = { 'Tarjeta': 0.04176, 'Aplicación': 0.4213 };

            const calcularTotal = () => {
                let subtotal = carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0);
                let pct = parseInt(selectDescuento.value) || 0;
                let manual = parseFloat(inputAjusteTotal.value);

                let base = (manual && manual >= 0) ? manual : subtotal;
                let total = base * (1 - (pct / 100));

                totalPedidoSpan.textContent = pct === 100 ? "CORTESÍA" : `$${total.toFixed(2)}`;

                if (selectedPago === 'Mixto') {
                    const efectivo = parseFloat(inputMixtoEfectivo.value) || 0;
                    const resto = total - efectivo;
                    mixtoRestoSpan.textContent = `$${resto.toFixed(2)}`;
                    mixtoRestoSpan.style.color = resto < 0 ? 'var(--color-brand)' : 'inherit';
                    if (total > 0) {
                        infoComision.style.display = 'block';
                        infoComision.innerHTML = `Comisión ${selectedPagoSecundario}: -$${(Math.max(resto, 0) * (TASA_COMISION[selectedPagoSecundario] || 0)).toFixed(2)}`;
                    } else { infoComision.style.display = 'none'; }
                } else if (total > 0 && TASA_COMISION[selectedPago]) {
                    infoComision.style.display = 'block';
                    infoComision.innerHTML = selectedPago === 'Aplicación' && !manual
                        ? `⚠️ Ajuste Manual requerido`
                        : `Comisión ${selectedPago}: -$${(total * TASA_COMISION[selectedPago]).toFixed(2)}`;
                } else {
                    infoComision.style.display = 'none';
                }
                return total;
            };

            // --- 6. HERRAMIENTAS POS (FUNCIONES NUEVAS) ---
            
            // Función: Abrir Cajón
            window.abrirCajon = () => {
                DS.toast('Enviando comando para abrir el cajón de dinero...', { type: 'info' });
            };

            // Función: Pausar Orden (Hold)
            window.pausarOrden = () => {
                if (carrito.length === 0) return DS.toast('El ticket está vacío.', { type: 'warning' });
                const nombre = inputClienteNombre.value.trim() || "Cliente sin nombre";
                const orden = {
                    id: Date.now(), fecha: new Date().toLocaleTimeString(),
                    nombre, carrito, canal: selectedCanal, pago: selectedPago, tipo: selectedTipo
                };

                let pausadas = JSON.parse(localStorage.getItem('ordenes_pausadas') || '[]');
                pausadas.push(orden);
                localStorage.setItem('ordenes_pausadas', JSON.stringify(pausadas));

                DS.toast(`Orden de ${nombre} guardada en espera.`, { type: 'success' });
                // Limpiar POS
                carrito = []; inputClienteNombre.value = ''; inputTelefono.value = ''; inputAjusteTotal.value = '';
                renderCarrito();
            };

            // Función: Ver Órdenes Pausadas
            window.verPausadas = () => {
                const lista = document.getElementById('lista-pausadas');
                let pausadas = JSON.parse(localStorage.getItem('ordenes_pausadas') || '[]');
                lista.innerHTML = '';
                
                if (pausadas.length === 0) {
                    lista.innerHTML = '<p style="text-align:center; color:var(--color-text-muted);">No hay órdenes en espera.</p>';
                } else {
                    pausadas.forEach(o => {
                        const div = document.createElement('div');
                        div.style.cssText = "background:var(--color-surface-alt); padding:15px; border-radius:var(--radius-md); display:flex; justify-content:space-between; align-items:center;";
                        div.innerHTML = `<div><strong style="display:block; font-size:16px;">${o.nombre}</strong><span style="font-size:12px; color:var(--color-text-muted);"><i class="fas fa-clock"></i> ${o.fecha} - ${o.carrito.length} items</span></div>
                        <button class="btn btn-primary">Recuperar</button>`;

                        div.querySelector('button').onclick = async () => {
                            if(carrito.length > 0 && !await DS.confirm('¿Reemplazar la orden actual por esta?', { title: 'Recuperar orden' })) return;
                            carrito = o.carrito; inputClienteNombre.value = o.nombre;
                            selectedCanal = o.canal; selectedPago = o.pago; selectedTipo = o.tipo;
                            document.getElementById('btn-select-canal').innerHTML = `<i class="fas fa-store"></i> ${selectedCanal}`;
                            document.getElementById('btn-select-pago').innerHTML = `<i class="fas fa-money-bill"></i> ${selectedPago}`;
                            document.querySelectorAll('.btn-tipo').forEach(b => { b.classList.remove('active'); if(b.dataset.tipo === selectedTipo) b.classList.add('active'); });
                            
                            // Remover de la lista
                            pausadas = pausadas.filter(x => x.id !== o.id);
                            localStorage.setItem('ordenes_pausadas', JSON.stringify(pausadas));
                            document.getElementById('modalPausadas').style.display='none';
                            renderCarrito();
                        };
                        lista.appendChild(div);
                    });
                }
                document.getElementById('modalPausadas').style.display = 'flex';
            };

            // --- 7. FINALIZAR PEDIDO ---
            btnCobrar.addEventListener('click', async () => {
                if (carrito.length === 0) return DS.toast('El ticket está vacío.', { type: 'warning' });
                const n = inputClienteNombre.value.trim();
                if (!n) { inputClienteNombre.focus(); return DS.toast('Ingresa el Nombre o Mesa.', { type: 'warning' }); }

                const t = calcularTotal();

                const payload = {
                    cliente: n, telefono: inputTelefono.value.trim(), canal_venta: selectedCanal, metodo_pago: selectedPago, total_ajustado: t, tipo_consumo: selectedTipo, descuento: parseInt(selectDescuento.value)||0,
                    propina: parseFloat(inputPropina.value) || 0,
                    items: buildPedidoItems(carrito)
                };
                if (!editModeId && mesaIdActual) payload.mesa_id = mesaIdActual;

                if (selectedPago === 'Mixto') {
                    const efectivo = parseFloat(inputMixtoEfectivo.value) || 0;
                    const resto = t - efectivo;
                    if (efectivo <= 0 || resto <= 0) return DS.toast('Captura cuánto se pagó en efectivo; el resto se cobra en ' + selectedPagoSecundario + '.', { type: 'warning' });
                    payload.metodo_pago_secundario = selectedPagoSecundario;
                    payload.monto_efectivo = efectivo;
                    payload.monto_no_efectivo = resto;
                }

                if (!editModeId) pedidoRequestIdPendiente = pedidoRequestIdPendiente || generarRequestId();

                btnCobrar.disabled = true;

                try {
                    const data = await enviarPedido(API_BASE, token, payload, editModeId, pedidoRequestIdPendiente, (intento, ms) => {
                        mostrarEstadoConexion(`🔌 Sin conexión, reintentando el cobro (${Math.floor(ms/1000)}s)... no cierres esta pantalla.`);
                    });
                    ocultarEstadoConexion();
                    pedidoRequestIdPendiente = null;

                    let msj = editModeId ? 'Pedido actualizado.' : 'Pedido cobrado con éxito.';
                    if (data.recompensa) msj += '\n\n🎉 ¡Este cliente alcanzó su 8va visita!\nEl cupón saldrá en el ticket.';
                    await DS.notice(msj, { title: data.recompensa ? '¡Recompensa desbloqueada!' : 'Éxito', okText: 'Continuar' });

                    if(editModeId) { localStorage.removeItem('editPedidoData'); window.location.href = 'pedidos_lista.html'; }
                    else if (mesaIdActual) { window.location.href = 'mesas.html'; }
                    else { window.location.reload(); }
                } catch (e) {
                    ocultarEstadoConexion();
                    // pedidoRequestIdPendiente se conserva a propósito: si esto fue por falta de
                    // conexión, el próximo clic en Cobrar reintenta con el mismo id y el backend
                    // evita crear un pedido duplicado si el primer intento sí se había guardado.
                    await DS.notice('Error: ' + e.message, { title: 'No se pudo cobrar' });
                    btnCobrar.disabled = false;
                }
            });

            // Alertas KDS
            document.getElementById('btn-abrir-intercom').onclick = () => { document.getElementById('input-alerta').value = ''; document.getElementById('modalIntercom').style.display = 'flex'; };
            document.getElementById('close-intercom').onclick = () => { document.getElementById('modalIntercom').style.display = 'none'; };
            document.querySelectorAll('.btn-quick-alert').forEach(b => b.onclick = (e) => document.getElementById('input-alerta').value = e.target.textContent.replace(/[^\w\sñáéíóú]/gi, '').trim());
            document.getElementById('btn-enviar-alerta').onclick = async () => {
                const msj = document.getElementById('input-alerta').value.trim();
                if (!msj) return;
                try { await fetch(`${API_BASE}/alertas`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ mensaje: msj }) }); document.getElementById('modalIntercom').style.display = 'none'; DS.toast('Alerta enviada a cocina.', { type: 'success' }); } catch (e) {}
            };

            const solicitarModificadores = (nombreProducto, grupos) => new Promise((resolve, reject) => {
                const contenedor = document.getElementById('modal-mod-grupos');
                const modal = document.getElementById('modalModificadores');
                contenedor.innerHTML = '';
                document.getElementById('modal-mod-titulo').textContent = nombreProducto;

                const seleccion = {};
                grupos.forEach(g => {
                    const op = menuData.opciones[g] || [];
                    if (!op.length) return;
                    seleccion[g] = op[0];

                    const groupEl = document.createElement('div');
                    groupEl.className = 'mod-group';
                    groupEl.innerHTML = `<span class="mod-group-label">${g}</span><div class="mod-group-chips"></div>`;
                    const chipsRow = groupEl.querySelector('.mod-group-chips');

                    op.forEach((o, i) => {
                        const chip = document.createElement('button');
                        chip.type = 'button';
                        chip.className = `chip${i === 0 ? ' selected' : ''}`;
                        chip.textContent = o.valor + (o.precio_adicional > 0 ? ` +$${o.precio_adicional}` : '');
                        chip.onclick = () => {
                            seleccion[g] = o;
                            chipsRow.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
                            chip.classList.add('selected');
                        };
                        chipsRow.appendChild(chip);
                    });
                    contenedor.appendChild(groupEl);
                });

                const cerrar = () => { modal.style.display = 'none'; };
                document.getElementById('btn-agregar-mod').onclick = () => { cerrar(); resolve(Object.values(seleccion)); };
                document.getElementById('btn-cancelar-mod').onclick = () => { cerrar(); reject(new Error('Cancelado')); };
                modal.style.display = 'flex';
            });

            init();
        });
    </script>
</body>
</html>
