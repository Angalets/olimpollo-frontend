<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Olimpollo</title>
    <link rel="stylesheet" href="design-system.css">

    <style>
        body { padding-bottom: 40px; }

        /* HEADER & HERO */
        header {
            background: var(--color-surface);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            color: var(--color-brand);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .hero {
            background: linear-gradient(rgba(15,17,21,0.65), rgba(15,17,21,0.65)), url('https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?q=80&w=2070&auto=format&fit=crop') center/cover;
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-family: var(--font-display);
            margin: 0 0 10px 0;
            font-size: 26px;
        }

        .hero p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* NAVEGACIÓN DE CATEGORÍAS */
        .category-nav {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 20px;
            scrollbar-width: none; /* Firefox */
        }
        .category-nav::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .cat-pill {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .cat-pill.active, .cat-pill:hover {
            background: var(--color-brand);
            color: white;
            border-color: var(--color-brand);
        }

        /* CONTENEDOR DEL MENÚ */
        main {
            padding: 0 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .categoria-section {
            margin-top: 30px;
            scroll-margin-top: 80px; /* Para que el sticky header no tape el título */
        }

        .categoria-titulo {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--color-text);
            border-bottom: 2px solid var(--color-brand);
            padding-bottom: 5px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .producto-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease;
        }

        .producto-card:active {
            transform: scale(0.98);
        }

        .producto-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: var(--color-surface-alt);
        }

        .producto-info {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .producto-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .producto-nombre {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-text);
            margin: 0;
            line-height: 1.2;
        }

        .producto-precio {
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--color-brand);
            font-size: 16px;
            margin-left: 10px;
            white-space: nowrap;
        }

        .producto-desc {
            font-size: 13px;
            color: var(--color-text-muted);
            margin: 0 0 12px 0;
            line-height: 1.4;
            flex: 1;
        }

        .producto-mods {
            font-size: 11px;
            background: var(--color-brand-tint);
            color: var(--color-brand);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            display: inline-block;
            align-self: flex-start;
            font-weight: 600;
        }

        /* LOADER */
        .loader {
            text-align: center;
            padding: 50px;
            color: var(--color-text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">Olimpollo</h1>
    </header>

    <div class="hero">
        <h1>Los Boneless del Olimpo</h1>
        <p>Calidad divina, sabor legendario.</p>
    </div>

    <!-- Navegación de categorías dinámica -->
    <div class="category-nav" id="nav-categorias">
        <!-- Se llena con JS -->
    </div>

    <main id="menu-container">
        <div class="loader" id="loader">
            <h2>Cargando menú... 🍗</h2>
        </div>
        <!-- Los productos se inyectan aquí -->
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_URL = 'https://olimpollo-api.onrender.com/api/menu/digital';
            const contenedorMenu = document.getElementById('menu-container');
            const navCategorias = document.getElementById('nav-categorias');
            const loader = document.getElementById('loader');

            const cargarMenu = async () => {
                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) throw new Error("No se pudo cargar el menú");
                    
                    const data = await response.json();
                    const productos = data.productos;
                    
                    if (productos.length === 0) {
                        loader.innerHTML = "<h3>El menú está vacío por el momento.</h3>";
                        return;
                    }

                    // Agrupar productos por categoría
                    const menuAgrupado = {};
                    productos.forEach(p => {
                        if (!menuAgrupado[p.categoria]) {
                            menuAgrupado[p.categoria] = [];
                        }
                        menuAgrupado[p.categoria].push(p);
                    });

                    // Limpiar loader
                    loader.style.display = 'none';

                    // Generar HTML
                    for (const [categoria, items] of Object.entries(menuAgrupado)) {
                        
                        // 1. Crear botón de navegación
                        const navId = `cat-${categoria.replace(/\s+/g, '-').toLowerCase()}`;
                        const pill = document.createElement('a');
                        pill.href = `#${navId}`;
                        pill.className = 'cat-pill';
                        pill.textContent = categoria;
                        navCategorias.appendChild(pill);

                        // 2. Crear sección de productos
                        const section = document.createElement('div');
                        section.className = 'categoria-section';
                        section.id = navId;
                        
                        let html = `
                            <h2 class="categoria-titulo">${categoria}</h2>
                            <div class="productos-grid">
                        `;

                        items.forEach(item => {
                            // Validar imagen por defecto
                            const imagen = item.imagen_url ? item.imagen_url : 'https://placehold.co/400x300/ecf0f1/a0a0a0?text=Olimpollo';
                            const descripcion = item.descripcion ? item.descripcion : '';
                            const esPersonalizable = !!item.grupos_modificadores || (Array.isArray(item.componentes) && item.componentes.length > 0);
                            const mods = esPersonalizable ? `<span class="producto-mods">+ Personalizable</span>` : '';

                            html += `
                                <div class="producto-card">
                                    <img src="${imagen}" alt="${item.nombre_venta}" class="producto-img" loading="lazy">
                                    <div class="producto-info">
                                        <div class="producto-header">
                                            <h3 class="producto-nombre">${item.nombre_venta}</h3>
                                            <span class="producto-precio">$${parseFloat(item.precio_base).toFixed(2)}</span>
                                        </div>
                                        <p class="producto-desc">${descripcion}</p>
                                        ${mods}
                                    </div>
                                </div>
                            `;
                        });

                        html += `</div>`; // Cierre grid
                        section.innerHTML = html;
                        contenedorMenu.appendChild(section);
                    }

                    // Pequeño script para resaltar la categoría activa al hacer scroll
                    marcarPillActiva();

                } catch (error) {
                    console.error("Error:", error);
                    loader.innerHTML = "<h3 style='color:var(--color-brand);'>Ocurrió un error al cargar nuestro menú. Intenta refrescar la página.</h3>";
                }
            };

            const marcarPillActiva = () => {
                const pills = document.querySelectorAll('.cat-pill');
                if(pills.length > 0) pills[0].classList.add('active'); // Activar primera por defecto

                pills.forEach(pill => {
                    pill.addEventListener('click', function(e) {
                        pills.forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                    });
                });
            };

            cargarMenu();
        });
    </script>
</body>
</html>
