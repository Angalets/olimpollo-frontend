<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Olimpollo - Lista de Pedidos</title>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    header { background: var(--color-surface); padding: 15px 40px; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); }
    header .logo { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-decoration: none; color: var(--color-text); }
    header nav { display: flex; gap: 20px; }
    header nav a { text-decoration: none; color: var(--color-text-muted); font-weight: 600; font-size: 14px; transition: color 0.2s; }
    header nav a:hover { color: var(--color-brand); }
    .user-info { display: flex; align-items: center; gap: 16px; }
    #user-identifier { font-weight: 600; background: var(--color-surface-alt); padding: 5px 12px; border-radius: var(--radius-full); font-size: 13px; }

    main { flex: 1; padding: 40px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; }
    .page-title { margin-bottom: 30px; font-size: 26px; }
    .card { background: var(--color-surface); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow-sm); margin-bottom: 25px; }
    table { width: 100%; border-collapse: collapse; background: var(--color-surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
    th, td { padding: 14px 15px; text-align: left; border-bottom: 1px solid var(--color-border); }
    th { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--color-text-muted); background: var(--color-surface-alt); }
    tr:hover td { background: var(--color-brand-tint); }
    footer { text-align: center; padding: 20px; font-size: 13px; color: var(--color-text-muted); }

    .layout-container { display: flex; gap: 25px; flex-wrap: wrap; }
    .pedidos-lista { flex: 3; min-width: 450px; }
    .detalles { flex: 1; min-width: 300px; align-self: flex-start; }
    .detalles ul { list-style: none; padding: 0; }
    .filtros-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; align-items: flex-end; }

    .finance-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px; }
    .finance-total { border-top: 1px solid var(--color-border); margin-top: 10px; padding-top: 10px; font-weight: 700; font-size: 16px; }
    .finance-neto { color: var(--color-success); font-size: 18px; margin-top: 5px; }
    .finance-comision { color: var(--color-brand); }
  </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Olimpollo</a>
        <nav>
          <a href="pedidos.html">POS</a>
          <a href="mesas.html">Mesas</a>
          <a href="reportes.html">Reportes</a>
          <a href="pedidos_lista.html" style="color: var(--color-brand);">Pedidos</a>
          <a href="inventario.html">Inventario</a>
        </nav>
        <div class="user-info">
            <span id="user-identifier"></span>
            <button class="btn btn-secondary btn-sm" id="btn-logout">Cerrar Sesión</button>
        </div>
    </header>

  <main>
    <h2 class="page-title ds-display">Historial de Órdenes</h2>

    <div class="card">
        <div class="filtros-grid">
            <div>
                <label for="filtro-canal">Filtrar por Canal:</label>
                <select id="filtro-canal" class="select">
                    <option value="Todos">Todos los Canales</option>
                    <option value="OyR">OyR</option>
                    <option value="Uber">Uber</option>
                    <option value="Didi">Didi</option>
                    <option value="Rappi">Rappi</option>
                    <option value="Empleado">Empleado</option>
                </select>
            </div>
            <div>
                <label for="filtro-fecha-inicio">Desde:</label>
                <input type="date" id="filtro-fecha-inicio" class="input">
            </div>
            <div>
                <label for="filtro-fecha-fin">Hasta:</label>
                <input type="date" id="filtro-fecha-fin" class="input">
            </div>
            <button id="btn-aplicar-filtro" class="btn btn-primary">Aplicar Filtro</button>
        </div>
    </div>
    
    <div class="layout-container">
      <div class="pedidos-lista">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Canal</th>
                    <th>Cliente</th>
                    <th>Estado</th>
                    <th>Total</th>
                    <th>Fecha</th> <th>Hora</th>
                    <th>Acciones</th> 
                </tr>
            </thead>
            <tbody id="tabla-pedidos-body"></tbody>
        </table>
      </div>

      <div class="detalles card">
          <h3 id="detalle-titulo">Detalles del Pedido</h3>
          <div id="detalle-contenido"><p>Selecciona un pedido para ver sus detalles.</p></div>
          <div id="panel-acciones" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;"></div>
      </div>
    </div>
  </main>

  <footer>&copy; 2026 Los Boneless del Olimpo</footer>

<script src="design-system.js"></script>
<script>
(function() {
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        const response = await originalFetch(...args);
        if (response.status === 401) {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userRole');
            if (!location.pathname.endsWith('login.html')) window.location.href = 'login.html';
        }
        return response;
    };
})();
function parseJwt(token) { try { const base64Url = token.split('.')[1]; const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/'); const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')); return JSON.parse(jsonPayload); } catch (e) { return null; } }

document.addEventListener('DOMContentLoaded', () => {

    const API_PEDIDOS_URL = 'https://olimpollo-api.onrender.com/api/pedidos';
    const tablaBody = document.getElementById('tabla-pedidos-body');
    const detalleContenido = document.getElementById('detalle-contenido');
    const panelAcciones = document.getElementById('panel-acciones');

    const filtroCanal = document.getElementById('filtro-canal');
    const filtroFechaInicio = document.getElementById('filtro-fecha-inicio');
    const filtroFechaFin = document.getElementById('filtro-fecha-fin');
    const btnAplicarFiltro = document.getElementById('btn-aplicar-filtro');

    let pedidos = []; 
    let pedidoSeleccionado = null;

    const token = localStorage.getItem('authToken');
    if(token) {
        const userData = parseJwt(token);
        if (userData && userData.username) document.getElementById('user-identifier').textContent = userData.username;
    } else {
        window.location.href = 'login.html';
    }
    const cerrarSesion = () => {
        localStorage.removeItem('authToken');
        localStorage.removeItem('userRole');
        window.location.href = 'login.html';
    };
    document.getElementById('btn-logout').addEventListener('click', cerrarSesion);

    const renderPedidos = async () => {
        const canal = filtroCanal.value;
        const fechaInicio = filtroFechaInicio.value;
        const fechaFin = filtroFechaFin.value;

        let params = new URLSearchParams();
        if (canal && canal !== 'Todos') params.append('canal', canal);
        if (fechaInicio) params.append('fechaInicio', fechaInicio);
        if (fechaFin) params.append('fechaFin', fechaFin);
        
        const queryString = params.toString();
        const url = queryString ? `${API_PEDIDOS_URL}?${queryString}` : API_PEDIDOS_URL;

        try {
            const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
            if (!response.ok) throw new Error('Error al cargar pedidos.');

            pedidos = await response.json();
            tablaBody.innerHTML = '';

            if (pedidos.length === 0) {
                 tablaBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No se encontraron pedidos para este filtro.</td></tr>';
                 mostrarDetalles(null);
                 return;
            }

            pedidos.forEach(pedido => {
                const tr = document.createElement('tr');
                tr.dataset.pedidoId = pedido.id;

                let colorEstado = '';
                if (pedido.estado === 'Entregado') colorEstado = 'style="background-color: var(--color-success-tint); font-weight: bold;"';
                else if (pedido.estado === 'Cancelado') colorEstado = 'style="background-color: var(--color-brand-tint); text-decoration: line-through;"';
                // AÑADIDO: Distintivo visual para estado "Listo"
                else if (pedido.estado === 'Listo') colorEstado = 'style="background-color: var(--color-warning-tint); font-weight: bold; color: var(--color-text);"';
                // Distintivo visual en la tabla si tiene recompensa
                const estrella = pedido.recompensa ? '⭐ ' : '';

                const fechaObj = new Date(pedido.fecha_creacion);
                const fecha = fechaObj.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const hora = fechaObj.toLocaleTimeString('es-MX', {hour: '2-digit', minute:'2-digit'});
                const canal = pedido.canal_venta || 'N/A'; 

                tr.innerHTML = `
                    <td>${estrella}#${pedido.id.toString().padStart(3, '0')}</td>
                    <td>${canal}</td>
                    <td>${pedido.cliente}</td>
                    <td ${colorEstado}>${pedido.estado}</td>
                    <td>$${pedido.total.toFixed(2)}</td>
                    <td>${fecha}</td>
                    <td>${hora}</td>
                    <td><button type="button" class="btn btn-secondary btn-sm btn-detalle" data-id="${pedido.id}">Ver</button></td>
                `;
                tablaBody.appendChild(tr);
            });
            mostrarDetalles(null); 
        } catch (error) {
            console.error('Error al cargar pedidos:', error);
            tablaBody.innerHTML = '<tr><td colspan="8" style="color:var(--color-brand); font-weight:bold;">Error: No se pudo cargar la lista de pedidos.</td></tr>';
        }
    };

    // IMPRESIÓN DE TICKET Y CUPÓN
    const imprimirTicket = (pedido) => {
        const ventana = window.open('', 'PRINT', 'height=600,width=300');
        const fechaObj = new Date(pedido.fecha_creacion);
        const fecha = fechaObj.toLocaleDateString('es-MX');
        const hora = fechaObj.toLocaleTimeString('es-MX', {hour: '2-digit', minute:'2-digit'});

        let itemsHTML = '';
        pedido.items.forEach(item => {
            itemsHTML += `
                <tr>
                    <td class="col-cant">${item.cantidad}</td>
                    <td class="col-prod">
                        ${item.nombre_producto}
                        ${item.notas ? `<br><small>(${item.notas})</small>` : ''}
                    </td>
                    <td class="col-prec">$${(item.precio_unitario * item.cantidad).toFixed(2)}</td>
                </tr>`;
        });

        const tipoConsumoTexto = pedido.tipo_consumo === 'Comedor' ? '🍽️ PARA COMER AQUÍ' : '🛍️ PARA LLEVAR';

        // Lógica del Cupón
        const cuponHTML = pedido.recompensa ? `
            <div class="divider" style="margin-top: 15px;"></div>
            <div style="border: 2px dashed #000; text-align: center; padding: 10px; margin: 10px 0; border-radius: 8px;">
                <h2 style="margin: 0; font-size: 16px;">🎟️ ¡CUPÓN GANADOR!</h2>
                <p style="margin: 5px 0; font-size: 12px; font-weight: bold;">Felicidades por tu 8va visita</p>
                <h3 style="margin: 0; font-size: 18px; text-transform: uppercase; background: #000; color: #fff; padding: 5px; border-radius: 4px;">1 PLATO FUERTE GRATIS</h3>
                <p style="margin: 5px 0 0; font-size: 10px;">Válido en tu próxima compra presentando este ticket.</p>
            </div>
        ` : '';

        ventana.document.write(`
            <html>
            <head>
                <title>Ticket #${pedido.id}</title>
                <style>
                    body { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 13px; font-weight: bold; color: #000 !important; width: 75mm; margin: 0 auto; padding: 0; }
                    .header { text-align: center; margin-bottom: 5px; }
                    .logo-ticket { width: 140px; max-width: 100%; margin-bottom: 2px; filter: grayscale(100%) contrast(150%); }
                    .header h2 { margin: 0; font-size: 18px; font-weight: 900; color: #000; text-transform: uppercase; }
                    .header p { margin: 0; font-size: 11px; }
                    .divider { border-bottom: 2px dashed #000; margin: 5px 0; }
                    .info { font-size: 12px; margin-bottom: 5px; font-weight: bold; }
                    .items { width: 100%; border-collapse: collapse; margin-bottom: 5px; font-size: 12px; }
                    .items td { padding: 4px 0; vertical-align: top; border-bottom: 1px dotted #ccc; }
                    .col-cant { width: 10%; text-align: center; font-weight: 900; font-size: 14px; }
                    .col-prod { width: 65%; font-weight: bold; }
                    .col-prec { width: 25%; text-align: right; font-weight: bold; }
                    .totals { text-align: right; margin-top: 5px; font-size: 14px; font-weight: bold; }
                    .total-big { font-size: 18px; font-weight: 900; margin-top: 2px; color: #000; }
                    .footer { text-align: center; margin-top: 10px; margin-bottom: 0; font-size: 11px; font-weight: bold; }
                    .empaque-box { border: 2px solid #000; text-align: center; font-size: 16px; font-weight: 900; padding: 5px; margin: 5px 0; border-radius: 4px; }
                    @media print { @page { margin: 0; padding: 0; } body { margin: 0; padding: 0; } }
                </style>
            </head>
            <body>
                <div class="header">
                    <img src="https://i.postimg.cc/tCYLDScF/logo250.png" class="logo-ticket" alt="Logo Olimpollo">
                    <h2>OLIMPOLLO</h2>
                    <p>Los Boneless del Olimpo</p>
                    <p>Hermosillo, Sonora</p>
                    <div class="divider"></div>
                </div>
                
                <div class="info">
                    <strong>Folio: #${pedido.id.toString().padStart(4, '0')}</strong><br>
                    Fecha: ${fecha} ${hora}<br>
                    Cliente: ${pedido.cliente}<br>
                    Canal: ${pedido.canal_venta || 'Mostrador'}
                </div>
                
                <div class="empaque-box">${tipoConsumoTexto}</div>
                <div class="divider"></div>

                <table class="items">
                    ${itemsHTML}
                </table>
                <div class="divider"></div>

                <div class="totals">
                    ${pedido.descuento > 0 ? `Descuento Aplicado: ${pedido.descuento}%<br>` : ''}
                    Total: <div class="total-big">$${pedido.total.toFixed(2)}</div>
                    <small>Pago: ${pedido.metodo_pago === 'Mixto'
                        ? `Efectivo $${parseFloat(pedido.monto_efectivo || 0).toFixed(2)} + ${pedido.metodo_pago_secundario} $${parseFloat(pedido.monto_no_efectivo || 0).toFixed(2)}`
                        : (pedido.metodo_pago || 'Efectivo')}</small>
                    ${parseFloat(pedido.propina || 0) > 0 ? `<br><small>Propina: $${parseFloat(pedido.propina).toFixed(2)}</small>` : ''}
                </div>

                ${cuponHTML}

                <div class="footer">
                    <p>¡Gracias por tu compra!</p>
                    <p>Wifi: OlimpolloGuest</p>
                    <p>********</p>
                </div>
            </body>
            </html>
        `);

        ventana.document.close();
        ventana.focus();
        setTimeout(() => { ventana.print(); ventana.close(); }, 800);
    };

    const mostrarDetalles = (id) => {
        detalleContenido.innerHTML = '<p>Selecciona un pedido de la lista para ver sus detalles.</p>';
        panelAcciones.innerHTML = '';

        if (!id) return;
        pedidoSeleccionado = pedidos.find(p => p.id == id);
        if (!pedidoSeleccionado) return;

        const total = parseFloat(pedidoSeleccionado.total);
        const comision = parseFloat(pedidoSeleccionado.comision || 0);
        const ingresoNeto = total - comision;
        const metodo = pedidoSeleccionado.metodo_pago || 'Desconocido';
        const tipoConsumo = pedidoSeleccionado.tipo_consumo || 'Para Llevar';
        const descuento = pedidoSeleccionado.descuento || 0;
        const propina = parseFloat(pedidoSeleccionado.propina || 0);

        let iconoPago = '💰';
        if (metodo.includes('Tarjeta')) iconoPago = '💳';
        if (metodo.includes('Aplicación')) iconoPago = '📱';
        if (metodo.includes('Transferencia')) iconoPago = '🏦';
        if (metodo === 'Mixto') iconoPago = '💰💳';

        const detalleMetodo = metodo === 'Mixto'
            ? `Mixto (Efectivo $${parseFloat(pedidoSeleccionado.monto_efectivo || 0).toFixed(2)} + ${pedidoSeleccionado.metodo_pago_secundario} $${parseFloat(pedidoSeleccionado.monto_no_efectivo || 0).toFixed(2)})`
            : metodo;

        let itemsHTML = '';
        pedidoSeleccionado.items.forEach(item => {
            const subtotal = item.cantidad * item.precio_unitario;
            itemsHTML += `<li style="margin-bottom: 5px; border-bottom: 1px dashed var(--color-border); padding-bottom: 5px;">
                <div style="display:flex; justify-content:space-between;">
                    <span><strong>${item.cantidad}x</strong> ${item.nombre_producto}</span>
                    <span>$${subtotal.toFixed(2)}</span>
                </div>
                ${item.notas ? `<small style="color:var(--color-warning);">📝 ${item.notas}</small>` : ''}
            </li>`;
        });

        // Etiqueta visual si tiene recompensa
        const badgeRecompensa = pedidoSeleccionado.recompensa ?
            `<div style="background: var(--color-warning); color: #fff; padding: 5px; border-radius: var(--radius-sm); font-weight: bold; margin-bottom: 10px; text-align: center;">
                🎟️ Pedido Ganador de Recompensa (8va Visita)
            </div>` : '';

        const infoCancelacion = pedidoSeleccionado.estado === 'Cancelado' && pedidoSeleccionado.motivo_cancelacion ?
            `<div style="background: var(--color-brand-tint); padding: 10px; border-radius: var(--radius-md); margin-bottom: 10px;">
                <strong>❌ Cancelado por:</strong> ${pedidoSeleccionado.cancelado_por || 'Desconocido'}<br>
                <strong>Motivo:</strong> ${pedidoSeleccionado.motivo_cancelacion}<br>
                <small>${pedidoSeleccionado.fecha_cancelacion ? new Date(pedidoSeleccionado.fecha_cancelacion).toLocaleString('es-MX') : ''}</small>
            </div>` : '';

        detalleContenido.innerHTML = `
            ${badgeRecompensa}
            ${infoCancelacion}
            <div style="background: var(--color-surface-alt); padding: 15px; border-radius: var(--radius-md); margin-bottom: 15px;">
                <h3 style="margin:0; color: var(--color-brand);">#${pedidoSeleccionado.id.toString().padStart(4, '0')} - ${pedidoSeleccionado.cliente}</h3>
                <small style="color: var(--color-text-muted);">
                    ${new Date(pedidoSeleccionado.fecha_creacion).toLocaleDateString('es-MX')}
                    ${new Date(pedidoSeleccionado.fecha_creacion).toLocaleTimeString('es-MX', {hour: '2-digit', minute:'2-digit'})}
                </small>
                <div style="margin-top: 10px;">
                    <strong>Canal:</strong> ${pedidoSeleccionado.canal_venta || 'OyR'} |
                    <strong>Estado:</strong> ${pedidoSeleccionado.estado} |
                    <strong>Empaque:</strong> ${tipoConsumo}
                </div>
            </div>

            <div style="border: 1px solid var(--color-border); padding: 15px; border-radius: var(--radius-md); margin-bottom: 15px;">
                <h4 style="margin-top:0; border-bottom: 2px solid var(--color-border); padding-bottom: 5px;">📊 Desglose Financiero</h4>
                <div class="finance-row"><span>Método de Pago:</span><strong>${iconoPago} ${detalleMetodo}</strong></div>
                ${descuento > 0 ? `<div class="finance-row" style="color:var(--color-warning);"><span>Descuento / Cortesía:</span><span>-${descuento}%</span></div>` : ''}
                <div class="finance-row finance-total"><span>Total Cobrado:</span><span>$${total.toFixed(2)}</span></div>
                ${comision > 0 ? `<div class="finance-row finance-comision"><span>- Comisión:</span><span>$${comision.toFixed(2)}</span></div>` : ''}
                <div class="finance-row"><span style="align-self: flex-end; font-weight:500;">Ingreso Neto:</span><strong class="finance-neto">$${ingresoNeto.toFixed(2)}</strong></div>
                ${propina > 0 ? `<div class="finance-row" style="color:var(--color-success);"><span>Propina (aparte):</span><span>$${propina.toFixed(2)}</span></div>` : ''}
            </div>

            <h4>Productos:</h4>
            <ul>${itemsHTML}</ul>
        `;

let botonesHTML = `<button type="button" id="btn-imprimir-ticket" class="btn btn-secondary" style="width:100%;"><i class="fas fa-print"></i> Imprimir Ticket</button>`;

        // AÑADIDO: Ahora se pueden editar y cobrar pedidos "Pendientes" Y "Listos"
        if (pedidoSeleccionado.estado === 'Pendiente' || pedidoSeleccionado.estado === 'Listo') {
            botonesHTML += `
                <button type="button" id="btn-editar-pedido" class="btn" style="background:var(--color-warning); color:#fff; width:100%; margin-top: 10px;" data-id="${id}"><i class="fas fa-pen"></i> Editar en POS</button>
                <div style="display:flex; gap:10px; margin-top: 10px;">
                    <button type="button" id="btn-marcar-entregado" class="btn" style="background:var(--color-success); color:#fff; flex:1;" data-id="${id}">Marcar Entregado</button>
                    <button type="button" id="btn-marcar-cancelado" class="btn btn-danger-outline" style="flex:1;" data-id="${id}">Marcar Cancelado</button>
                </div>
            `;
        } else {
            botonesHTML += `<button type="button" id="btn-eliminar-registro" class="btn btn-danger-outline" style="width:100%; margin-top: 10px;" data-id="${id}" title="Borrar del historial permanentemente"><i class="fas fa-trash"></i> Eliminar Registro</button>`;
        }
        panelAcciones.innerHTML = botonesHTML;
    };

    panelAcciones.addEventListener('click', async (e) => {
        const id = pedidoSeleccionado?.id;
        if (!id) return;

        if (e.target.id === 'btn-imprimir-ticket') {
            imprimirTicket(pedidoSeleccionado);
        } 
        else if (e.target.id === 'btn-editar-pedido') {
            localStorage.setItem('editPedidoData', JSON.stringify(pedidoSeleccionado));
            window.location.href = 'pedidos.html';
        }
        else if (e.target.id === 'btn-marcar-entregado') {
            const ok = await DS.confirm(`¿Confirmas marcar el Pedido #${id} como ENTREGADO?`, { title: 'Marcar entregado' });
            if (ok) cambiarEstado(id, 'Entregado');
        }
        else if (e.target.id === 'btn-marcar-cancelado') {
            const motivo = await DS.prompt(`¿Por qué se cancela el Pedido #${id}?`, { title: 'Cancelar pedido' });
            if (motivo === null) return;
            if (!motivo.trim()) { DS.toast('Debes escribir un motivo para cancelar.', { type: 'warning' }); return; }
            cancelarPedido(id, motivo.trim());
        }
        else if (e.target.id === 'btn-eliminar-registro') {
            const ok = await DS.confirm(`¿Estás seguro de eliminar definitivamente el Pedido #${id}?`, { title: 'Eliminar registro', confirmText: 'Eliminar', danger: true });
            if (ok) {
                try {
                    const response = await fetch(`${API_PEDIDOS_URL}/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                    if (!response.ok) throw new Error('No se pudo eliminar.');
                    DS.toast('Pedido eliminado del historial.', { type: 'success' });
                    renderPedidos(); mostrarDetalles(null);
                } catch (error) { DS.toast('Error: ' + error.message, { type: 'error', duration: 0 }); }
            }
        }
    });

    const cambiarEstado = async (id, nuevoEstado) => {
        try {
            const response = await fetch(`${API_PEDIDOS_URL}/${id}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ estado: nuevoEstado })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || 'Error al actualizar estado.');
            DS.toast(`Pedido #${id} actualizado a ${nuevoEstado} con éxito.`, { type: 'success' });
            renderPedidos();
        } catch (error) { console.error(error); DS.toast('Fallo al cambiar el estado: ' + error.message, { type: 'error', duration: 0 }); }
    };

    const cancelarPedido = async (id, motivo) => {
        try {
            const response = await fetch(`${API_PEDIDOS_URL}/${id}/cancelar`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ motivo })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || 'Error al cancelar el pedido.');
            DS.toast(`Pedido #${id} cancelado.`, { type: 'success' });
            renderPedidos(); mostrarDetalles(null);
        } catch (error) { console.error(error); DS.toast('Fallo al cancelar: ' + error.message, { type: 'error', duration: 0 }); }
    };

    btnAplicarFiltro.addEventListener('click', renderPedidos);
    tablaBody.addEventListener('click', (e) => {
        const detalleBtn = e.target.closest('.btn-detalle');
        if (detalleBtn) mostrarDetalles(detalleBtn.dataset.id);
    });

    renderPedidos(); 
});
</script>
</body>
</html>
