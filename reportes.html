<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Olimpollo - Reportes</title>
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--color-surface); padding: 15px 40px; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); }
        header .logo { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-decoration: none; color: var(--color-text); }
        header nav { display: flex; gap: 20px; }
        header nav a { text-decoration: none; color: var(--color-text-muted); font-weight: 600; font-size: 14px; transition: color 0.2s; }
        header nav a:hover { color: var(--color-brand); }
        .user-info { display: flex; align-items: center; gap: 16px; }
        #user-identifier { font-weight: 600; background: var(--color-surface-alt); padding: 5px 12px; border-radius: var(--radius-full); font-size: 13px; }

        main { flex: 1; padding: 40px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .page-title { margin-bottom: 30px; font-size: 26px; }
        .card { background: var(--color-surface); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow-sm); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; background: var(--color-surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--color-border); }
        th { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--color-text-muted); background: var(--color-surface-alt); }
        footer { text-align: center; padding: 20px; font-size: 13px; color: var(--color-text-muted); }

        /* Estilos específicos para esta página */
        .filtros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-items: flex-end;
        }
        .chart-wrap { position: relative; height: 280px; margin: 15px 0 25px; }
        .chart-wrap canvas { max-width: 100%; }
        .heatmap-table { border-collapse: separate; border-spacing: 2px; font-size: 12px; white-space: nowrap; }
        .heatmap-table th { padding: 6px 8px; font-weight: 600; color: var(--color-text-muted); text-align: center; background: none; }
        .heatmap-table td { padding: 6px 8px; text-align: center; border-radius: 4px; min-width: 34px; }
        .heatmap-table .heatmap-total { background: var(--color-surface-alt) !important; font-weight: 700; color: var(--color-text) !important; }
        .heatmap-table .heatmap-label { text-align: left; font-weight: 600; color: var(--color-text); padding-right: 12px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Olimpollo</a>
        <nav>
          <a href="pedidos.html">POS</a>
          <a href="reportes.html">Reportes</a>
          <a href="pedidos_lista.html">Pedidos</a>
          <a href="inventario.html">Inventario</a>
        </nav>
        <div class="user-info">
            <span id="user-identifier"></span>
            <button class="btn btn-secondary btn-sm" id="btn-logout">Cerrar Sesión</button>
        </div>
    </header>

    <main>
        <h2 class="page-title ds-display">Generador de Reportes</h2>

        <div class="card" id="card-resumen-hoy">
            <h3 style="margin-top:0;">📊 Resumen de Hoy</h3>
            <div id="resumen-hoy-content" style="color:var(--color-text-muted);">Cargando...</div>
        </div>

        <div class="card">
            <div class="filtros-grid">
                <div>
                    <label for="select-tipo-reporte">Tipo de Reporte:</label>
                    <select id="select-tipo-reporte" class="select">
                        <option value="">Seleccionar Tipo</option>
                        <option value="platillos">Conteo de Platillos</option>
                        <option value="margen_platillos">Margen por Platillo</option>
                        <option value="horas_pico">Horas Pico (personal)</option>
                        <option value="top_clientes">Top Clientes (histórico)</option>
                        <option value="costeo_menu">Costeo de Menú (por producto)</option>
                        <option value="ventas">Reporte de Ventas</option>
                       <option value="insumos_teoricos">Uso de Insumos (Teórico)</option>
                        <option value="historico_inventario">Inventario Histórico</option>
                        <option value="semanal_gerencial">Resumen Semanal Gerencial</option>
                        <option value="cogs">KPI: Porcentaje COGS</option>
                        <option value="tendencia_ventas">Tendencia de Ventas (diaria)</option>
                        <option value="tendencia_cogs">Tendencia de % COGS (semanal)</option>
                        <option value="merma">Merma (Teórico vs. Físico)</option>
                    </select>
                </div>
                <div>
                    <label for="fechaInicio" id="label-fecha-inicio">Fecha Inicio / Fecha Única:</label>
                    <input type="date" id="fechaInicio" class="input">
                    <select id="select-fecha-inicio-merma" class="select" style="display:none;"></select>
                </div>
                <div>
                    <label for="fechaFin" id="label-fecha-fin">Fecha Fin:</label>
                    <input type="date" id="fechaFin" class="input">
                    <select id="select-fecha-fin-merma" class="select" style="display:none;"></select>
                </div>
                <div style="display:flex; gap:10px;">
                    <button id="btn-generar" class="btn btn-primary" style="width: 100%;">Generar Reporte</button>
                    <button id="btn-exportar-csv" class="btn btn-secondary" title="Exportar el reporte generado a CSV"><i class="fas fa-download"></i></button>
                </div>
            </div>
            <div id="date-presets" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:15px;"></div>
            <p id="mensaje-reporte" style="margin-top: 15px; text-align: center;"></p>
        </div>

        <div id="resultados-reporte" class="card" style="display: none;">
            </div>
    </main>

    <footer>
        &copy; 2026 Los Boneless del Olimpo
    </footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<script src="design-system.js"></script>
<script>
        (function() {
            const originalFetch = window.fetch;
            window.fetch = async function(...args) {
                const response = await originalFetch(...args);
                if (response.status === 401) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('userRole');
                    if (!location.pathname.endsWith('login.html')) window.location.href = 'login.html';
                }
                return response;
            };
        })();
        // Función para decodificar el token JWT
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const API_URL = 'https://olimpollo-api.onrender.com/api/reportes'; 
            
            // --- 1. VERIFICACIÓN DE LOGIN Y USUARIO ---
            const token = localStorage.getItem('authToken');
            const role = localStorage.getItem('userRole');

            if (!token || !role) {
                window.location.href = 'login.html';
                return;
            }

            if (role !== 'Administrador' && role !== 'Gerente') {
                DS.notice('No tiene permisos para ver reportes.', { title: 'Acceso denegado' }).then(() => { window.location.href = 'index.html'; });
                return;
            }

            const userData = parseJwt(token);
            if (userData && userData.username) {
                document.getElementById('user-identifier').textContent = userData.username;
            }

            document.getElementById('btn-logout').addEventListener('click', () => {
                localStorage.removeItem('authToken');
                localStorage.removeItem('userRole');
                window.location.href = 'login.html';
            });
            
            // --- 2. ELEMENTOS DEL DOM ---
            const botonGenerar = document.getElementById('btn-generar');
            const mensajeElemento = document.getElementById('mensaje-reporte');
            const inputFechaInicio = document.getElementById('fechaInicio');
            const inputFechaFin = document.getElementById('fechaFin');
            const selectTipoReporte = document.getElementById('select-tipo-reporte');
            const resultadosDiv = document.getElementById('resultados-reporte');
            const labelFechaInicio = document.getElementById('label-fecha-inicio');
            const labelFechaFin = document.getElementById('label-fecha-fin');
            const selectFechaInicioMerma = document.getElementById('select-fecha-inicio-merma');
            const selectFechaFinMerma = document.getElementById('select-fecha-fin-merma');
            const datePresetsDiv = document.getElementById('date-presets');
            const btnExportarCSV = document.getElementById('btn-exportar-csv');
            let fechasInventarioCache = null;

            // --- Helpers de fecha (para presets y el resumen del día) ---
            const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
            const DATE_PRESETS = [
                { label: 'Hoy', calc: () => { const h = toISO(new Date()); return [h, h]; } },
                { label: 'Ayer', calc: () => { const a = toISO(addDays(new Date(), -1)); return [a, a]; } },
                { label: 'Esta semana', calc: () => { const hoy = new Date(); const offset = (hoy.getDay() + 6) % 7; return [toISO(addDays(hoy, -offset)), toISO(hoy)]; } },
                { label: 'Este mes', calc: () => { const hoy = new Date(); return [toISO(new Date(hoy.getFullYear(), hoy.getMonth(), 1)), toISO(hoy)]; } },
                { label: 'Mes pasado', calc: () => { const hoy = new Date(); return [toISO(new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1)), toISO(new Date(hoy.getFullYear(), hoy.getMonth(), 0))]; } },
                { label: 'Últimos 7 días', calc: () => [toISO(addDays(new Date(), -6)), toISO(new Date())] },
                { label: 'Últimos 30 días', calc: () => [toISO(addDays(new Date(), -29)), toISO(new Date())] }
            ];
            datePresetsDiv.innerHTML = DATE_PRESETS.map((p, i) => `<button type="button" class="btn btn-secondary btn-sm" data-preset="${i}">${p.label}</button>`).join('');
            datePresetsDiv.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-preset]');
                if (!btn) return;
                const [inicio, fin] = DATE_PRESETS[parseInt(btn.dataset.preset)].calc();
                inputFechaInicio.value = inicio;
                inputFechaFin.value = fin;
            });

            const cargarFechasInventario = async () => {
                if (fechasInventarioCache) return fechasInventarioCache;
                const response = await fetch(`${API_URL}/inventario-fechas`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'No se pudieron cargar las fechas de conteo.');
                fechasInventarioCache = data;
                return data;
            };

            const poblarSelectorFechas = (select, fechas) => {
                select.innerHTML = fechas.map(f => `<option value="${f.fecha}">${f.fecha} (${f.insumos_contados} insumos)</option>`).join('');
            };

            selectTipoReporte.addEventListener('change', async () => {
                const esMerma = selectTipoReporte.value === 'merma';
                const sinFecha = selectTipoReporte.value === 'top_clientes' || selectTipoReporte.value === 'costeo_menu';
                document.getElementById('fechaInicio').style.display = esMerma || sinFecha ? 'none' : '';
                document.getElementById('fechaFin').style.display = esMerma || sinFecha ? 'none' : '';
                selectFechaInicioMerma.style.display = esMerma ? '' : 'none';
                selectFechaFinMerma.style.display = esMerma ? '' : 'none';
                labelFechaInicio.textContent = esMerma ? 'Conteo Inicial:' : sinFecha ? 'Reporte histórico (sin fecha):' : 'Fecha Inicio / Fecha Única:';
                labelFechaFin.textContent = esMerma ? 'Conteo Final:' : sinFecha ? '' : 'Fecha Fin:';
                datePresetsDiv.style.display = esMerma || sinFecha ? 'none' : '';
                if (!esMerma) return;
                if (selectFechaInicioMerma.options.length > 0) return;
                try {
                    const fechas = await cargarFechasInventario();
                    if (fechas.length < 2) {
                        mensajeElemento.textContent = 'Se necesitan al menos 2 conteos de inventario guardados ("Cierre de día" en Inventario) para calcular merma.';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    poblarSelectorFechas(selectFechaInicioMerma, fechas);
                    poblarSelectorFechas(selectFechaFinMerma, fechas);
                    // Por defecto: el conteo más reciente como "final" y el segundo más reciente como "inicial"
                    selectFechaFinMerma.selectedIndex = 0;
                    selectFechaInicioMerma.selectedIndex = 1;
                } catch (error) {
                    mensajeElemento.textContent = error.message;
                    mensajeElemento.style.color = 'var(--color-brand)';
                }
            });

            // --- 3. HELPERS DE GRÁFICAS (Chart.js) ---
            // Paleta categórica de orden fijo (misma identidad = mismo color siempre,
            // sin importar qué categorías aparezcan en un periodo dado).
            const PALETTE_LIGHT = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
            const PALETTE_DARK  = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
            const METODO_COLOR_MAP = { 'Efectivo': 0, 'Tarjeta': 1, 'Transferencia': 2, 'Aplicación': 3 };
            const CANAL_COLOR_MAP = { 'OyR': 0, 'Uber': 1, 'Didi': 2, 'Rappi': 3, 'Empleado': 4 };
            let activeCharts = [];

            const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
            const isDarkMode = () => {
                const attr = document.documentElement.getAttribute('data-theme');
                if (attr === 'dark') return true;
                if (attr === 'light') return false;
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            };
            const paletteColor = (map, key, fallbackIndex) => {
                const palette = isDarkMode() ? PALETTE_DARK : PALETTE_LIGHT;
                const idx = (key in map) ? map[key] : (fallbackIndex % palette.length);
                return palette[idx];
            };
            const metricColor = () => (isDarkMode() ? PALETTE_DARK[0] : PALETTE_LIGHT[0]);
            // Interpola entre el color de superficie (intensidad 0) y el color métrico (intensidad 1),
            // para el mapa de calor de horas pico — sequential, un solo tono, más oscuro = más alto.
            const hexToRgb = (hex) => { const h = hex.replace('#', ''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
            const heatColor = (t) => {
                const [r1, g1, b1] = hexToRgb(cssVar('--color-surface-alt').startsWith('#') ? cssVar('--color-surface-alt') : (isDarkMode() ? '#232A35' : '#F3F4F6'));
                const [r2, g2, b2] = hexToRgb(metricColor());
                const r = Math.round(r1 + (r2 - r1) * t), g = Math.round(g1 + (g2 - g1) * t), b = Math.round(b1 + (b2 - b1) * t);
                return `rgb(${r},${g},${b})`;
            };
            const heatTextColor = (t) => t > 0.55 ? '#FFFFFF' : cssVar('--color-text');
            // Colores de estado: fijos, no cambian con el tema (misma semántica siempre)
            const STATUS_COLORS = { 'Estrella': '#0ca30c', 'Caballo de Batalla': '#fab219', 'Enigma': '#ec835a', 'Perro': '#d03b3b', 'Sin receta': '#9CA3AF', 'Costo Incompleto': '#9CA3AF' };
            const CLASIFICACION_ICONO = { 'Estrella': '⭐', 'Caballo de Batalla': '🐴', 'Enigma': '❓', 'Perro': '🐶', 'Sin receta': '⚠️', 'Costo Incompleto': '⚠️' };
            const destroyCharts = () => { activeCharts.forEach(c => c.destroy()); activeCharts = []; };
            const money = (v) => '$' + Number(v).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            const baseChartOptions = (horizontal) => {
                const textColor = cssVar('--color-text-muted');
                const gridColor = cssVar('--color-border');
                const fontFamily = cssVar('--font-body') || "'Inter', sans-serif";
                return {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: horizontal ? 'y' : 'x',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: cssVar('--color-surface'),
                            titleColor: cssVar('--color-text'),
                            bodyColor: cssVar('--color-text'),
                            borderColor: gridColor,
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false
                        }
                    },
                    scales: {
                        x: { grid: { color: gridColor }, ticks: { color: textColor, font: { family: fontFamily } }, border: { display: false } },
                        y: { grid: { color: gridColor }, ticks: { color: textColor, font: { family: fontFamily } }, border: { display: false } }
                    }
                };
            };

            // Plugin propio (sin dependencias externas) para dibujar las líneas de umbral
            // de la matriz de ingeniería de menú, en vez de cargar chartjs-plugin-annotation.
            const quadrantLinesPlugin = {
                id: 'quadrantLines',
                afterDraw(chart, args, opts) {
                    if (!opts || opts.xThreshold === undefined) return;
                    const { ctx, chartArea, scales } = chart;
                    if (!chartArea) return;
                    const xPix = scales.x.getPixelForValue(opts.xThreshold);
                    const yPix = scales.y.getPixelForValue(opts.yThreshold);
                    ctx.save();
                    ctx.strokeStyle = opts.color;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(xPix, chartArea.top); ctx.lineTo(xPix, chartArea.bottom);
                    ctx.moveTo(chartArea.left, yPix); ctx.lineTo(chartArea.right, yPix);
                    ctx.stroke();
                    ctx.restore();
                }
            };
            // Se registra solo en el chart que lo necesita (options.plugins:[quadrantLinesPlugin]
            // en la instancia), no globalmente, para no afectar el resto de las gráficas.

            // --- Exportar CSV: toma las tablas del reporte YA generado, sin código por-reporte ---
            const escapeCSV = (v) => {
                const s = String(v ?? '').replace(/\s+/g, ' ').trim();
                return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
            };
            btnExportarCSV.addEventListener('click', () => {
                const tablas = resultadosDiv.querySelectorAll('table');
                if (tablas.length === 0) { DS.toast('Genera un reporte primero.', { type: 'warning' }); return; }
                const lineas = [];
                tablas.forEach((tabla, i) => {
                    if (i > 0) lineas.push('');
                    tabla.querySelectorAll('tr').forEach(tr => {
                        lineas.push([...tr.children].map(td => escapeCSV(td.textContent)).join(','));
                    });
                });
                const nombreReporte = selectTipoReporte.options[selectTipoReporte.selectedIndex]?.text || 'reporte';
                const nombreArchivo = `${nombreReporte.replace(/[^a-z0-9]+/gi, '_')}_${toISO(new Date())}.csv`;
                const blob = new Blob(['﻿' + lineas.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = nombreArchivo;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // --- Resumen de Hoy (landing, se carga solo al entrar a la página) ---
            const cargarResumenHoy = async () => {
                const contenedor = document.getElementById('resumen-hoy-content');
                try {
                    const hoyStr = toISO(new Date());
                    const ayerStr = toISO(addDays(new Date(), -1));
                    const [resHoy, resAyer] = await Promise.all([
                        fetch(`${API_URL}/ventas?fechaInicio=${hoyStr}&fechaFin=${hoyStr}`, { headers: { 'Authorization': `Bearer ${token}` } }),
                        fetch(`${API_URL}/ventas?fechaInicio=${ayerStr}&fechaFin=${ayerStr}`, { headers: { 'Authorization': `Bearer ${token}` } })
                    ]);
                    const dataHoy = await resHoy.json();
                    const dataAyer = await resAyer.json();
                    if (!resHoy.ok || !resAyer.ok) throw new Error('No se pudo cargar el resumen.');

                    const ventaHoy = parseFloat(dataHoy.ventas_totales || 0);
                    const ventaAyer = parseFloat(dataAyer.ventas_totales || 0);
                    const pedidosHoy = parseInt(dataHoy.total_pedidos || 0);
                    const delta = ventaAyer > 0 ? ((ventaHoy - ventaAyer) / ventaAyer) * 100 : null;
                    const deltaColor = delta === null ? 'var(--color-text-muted)' : (delta >= 0 ? 'var(--color-success)' : 'var(--color-brand)');
                    const deltaTexto = delta === null ? 'sin venta ayer para comparar' : `${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta).toFixed(1)}% vs. ayer`;

                    contenedor.innerHTML = `
                        <div style="display:flex; gap:30px; flex-wrap:wrap; align-items:baseline;">
                            <div>
                                <small style="color:var(--color-text-muted);">Venta de Hoy</small>
                                <div style="font-size:28px; font-weight:800; color:var(--color-text);">${money(ventaHoy)}</div>
                                <small style="color:${deltaColor}; font-weight:600;">${deltaTexto}</small>
                            </div>
                            <div>
                                <small style="color:var(--color-text-muted);">Pedidos de Hoy</small>
                                <div style="font-size:28px; font-weight:800; color:var(--color-text);">${pedidosHoy}</div>
                            </div>
                        </div>`;
                } catch (error) {
                    contenedor.innerHTML = '<p style="color:var(--color-text-muted); margin:0;">No se pudo cargar el resumen de hoy.</p>';
                }
            };

            // --- 4. FUNCIONES DE REPORTES ---

            const generarReporteHistorico = async (fecha) => {
                resultadosDiv.innerHTML = '<h4>Cargando registros...</h4>';
                resultadosDiv.style.display = 'block';
                try {
                    const url = `${API_URL}/inventario?fecha=${fecha}`;
                    const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.mensaje || 'Error al generar reporte histórico');
                    
                    let tablaHTML = `<h4>Inventario Registrado el ${fecha}</h4><table><thead><tr><th>Insumo</th><th>Cantidad</th><th>Unidad</th><th>Categoría</th></tr></thead><tbody>`;
                    data.forEach(item => {
                        tablaHTML += `<tr><td>${item.nombre_insumo}</td><td>${item.cantidad_registrada}</td><td>${item.unidad_medida}</td><td>${item.categoria}</td></tr>`;
                    });
                    tablaHTML += `</tbody></table>`;
                    
                    resultadosDiv.innerHTML = tablaHTML;
                    mensajeElemento.textContent = 'Reporte histórico generado exitosamente.';
                    mensajeElemento.style.color = 'var(--color-success)';
                } catch (error) { resultadosDiv.innerHTML = `<p style="color:var(--color-brand); font-weight:bold;">${error.message}</p>`; }
            };
            
            const generarReporteVentas = async (fechaInicio, fechaFin) => {
                resultadosDiv.innerHTML = '<h4>Calculando ventas y comisiones...</h4>';
                resultadosDiv.style.display = 'block';

            // Tendencia de Ventas (día por día)

                resultadosDiv.style.display = 'block';
                const url = `${API_URL}/ventas-diario?fechaInicio=${fechaInicio}&fechaFin=${fechaFin}`;

                    const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Error al obtener datos');
                    if (data.length === 0) { resultadosDiv.innerHTML = '<p>No hay ventas registradas en este periodo.</p>'; return; }

                    // Rellenar días sin venta con $0 para que la línea no salte fechas
                    const porFecha = {};
                    data.forEach(d => { porFecha[d.fecha] = d; });
                    const dias = [];
                    let cursor = new Date(fechaInicio + 'T00:00:00');
                    const fin = new Date(fechaFin + 'T00:00:00');
                    while (cursor <= fin) {
                        const key = cursor.toISOString().slice(0, 10);
                        dias.push(porFecha[key] || { fecha: key, total_pedidos: 0, ventas_totales: 0, comisiones: 0 });
                        cursor.setDate(cursor.getDate() + 1);
                    }

                    let html = `<h4>Tendencia de Ventas (${fechaInicio} al ${fechaFin})</h4>`;
                    html += `<div class="chart-wrap"><canvas id="chart-tendencia-ventas"></canvas></div>`;
                    html += `<table><thead><tr><th>Fecha</th><th>Pedidos</th><th>Venta Bruta</th><th>Comisiones</th></tr></thead><tbody>`;
                    dias.forEach(d => {
                        html += `<tr><td>${d.fecha}</td><td>${d.total_pedidos}</td><td style="font-weight:bold;">$${parseFloat(d.ventas_totales).toFixed(2)}</td><td style="color:var(--color-brand);">$${parseFloat(d.comisiones).toFixed(2)}</td></tr>`;
                    });
                    html += '</tbody></table>';
                    resultadosDiv.innerHTML = html;

                    const color = metricColor();
                    const opts = baseChartOptions(false);
                    const chart = new Chart(document.getElementById('chart-tendencia-ventas'), {
                        type: 'line',
                        data: {
                            labels: dias.map(d => d.fecha),
                            datasets: [{
                                data: dias.map(d => parseFloat(d.ventas_totales)),
                                borderColor: color, backgroundColor: color + '1A',
                                borderWidth: 2, fill: true, tension: 0.25,
                                pointRadius: 0, pointHoverRadius: 6, pointBackgroundColor: color,
                                pointBorderColor: cssVar('--color-surface'), pointBorderWidth: 2
                            }]
                        },
                        options: {
                            ...opts,
                            interaction: { mode: 'index', intersect: false },
                            scales: { ...opts.scales, y: { ...opts.scales.y, ticks: { ...opts.scales.y.ticks, callback: (v) => '$' + v.toLocaleString('es-MX') } } },
                            plugins: { ...opts.plugins, tooltip: { ...opts.plugins.tooltip, callbacks: { label: (c) => money(c.parsed.y) } } }
                        }

                    activeCharts.push(chart);

                    mensajeElemento.textContent = 'Tendencia de ventas generada.';
                    mensajeElemento.style.color = 'var(--color-success)';

            // Tendencia de % COGS (por semana)

                resultadosDiv.style.display = 'block';
                const url = `${API_URL}/cogs-historico?fechaInicio=${fechaInicio}&fechaFin=${fechaFin}`;
                try {
                    const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });

                    const semanas = data.semanas || [];

                            plugins: { ...opts.plugins, tooltip: { ...opts.plugins.tooltip, callbacks: { label: (c) => c.parsed.y.toFixed(2) + '%' } } }

                    activeCharts.push(chart);

                    mensajeElemento.textContent = 'Tendencia de COGS generada.';
                    mensajeElemento.style.color = 'var(--color-success)';
                } catch (error) { resultadosDiv.innerHTML = `<p style="color:var(--color-brand); font-weight:bold;">${error.message}</p>`; }
            };

            // Merma (Teórico vs. Físico)
            const generarReporteMerma = async (fechaInicio, fechaFin) => {
                resultadosDiv.innerHTML = '<h4>Cruzando conteos físicos, compras y consumo teórico...</h4>';
                resultadosDiv.style.display = 'block';
                const url = `${API_URL}/merma?fechaInicio=${fechaInicio}&fechaFin=${fechaFin}`;
                try {
                    const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Error al calcular la merma');
                    if (data.reporte.length === 0) { resultadosDiv.innerHTML = '<p>No hay insumos con conteo en ambas fechas para comparar.</p>'; return; }

                    const perdidaTotal = data.reporte.filter(r => r.merma > 0).reduce((sum, r) => sum + r.merma_valor, 0);
                    const conMermaSignificativa = data.reporte.filter(r => r.merma_valor > 20 && (r.merma_pct === null || Math.abs(r.merma_pct) > 5));
                    const top = conMermaSignificativa.slice(0, 12);

                    let html = `
                        <h4>Merma: ${fechaInicio} → ${fechaFin}</h4>
                        <p style="font-size:0.9em; color:var(--color-text-muted); margin-bottom:20px;">* Merma = (conteo inicial + compras del periodo − conteo final) − consumo teórico según recetas vendidas. Positivo = se consumió más de lo que las ventas explican (posible desperdicio, robo, o error de medición/receta).</p>
                        <div style="display:flex; gap:15px; margin-bottom:25px; flex-wrap:wrap;">
                            <div style="flex:1; min-width:220px; background: var(--color-brand-tint); padding:15px; border-radius:10px; border-left:5px solid var(--color-brand);">
                                <small>Pérdida Estimada del Periodo</small>
                                <div style="font-size:24px; font-weight:bold; color:var(--color-brand);">${money(perdidaTotal)}</div>
                            </div>
                            <div style="flex:1; min-width:220px; background: var(--color-surface-alt); padding:15px; border-radius:10px; border-left:5px solid var(--color-border);">
                                <small>Insumos Comparados</small>
                                <div style="font-size:24px; font-weight:bold;">${data.reporte.length}</div>
                            </div>
                            <div style="flex:1; min-width:220px; background: var(--color-warning-tint); padding:15px; border-radius:10px; border-left:5px solid var(--color-warning);">
                                <small>Con Merma Significativa (&gt;$20 y &gt;5%)</small>
                                <div style="font-size:24px; font-weight:bold; color:var(--color-warning);">${conMermaSignificativa.length}</div>
                            </div>
                        </div>`;

                    if (data.omitidos && data.omitidos.length > 0) {
                        html += `<p style="font-size:0.85em; color:var(--color-text-muted); margin-bottom:15px;">⚠️ ${data.omitidos.length} insumo(s) con compras o ventas en el periodo no se pudieron comparar por no tener conteo final guardado: ${data.omitidos.join(', ')}.</p>`;
                    }

                    if (top.length > 0) {
                        html += `<div class="chart-wrap"><canvas id="chart-merma"></canvas></div>`;
                    }

                    html += `<div style="overflow-x:auto;"><table><thead><tr>
                        <th>Insumo</th><th>Conteo Inicial</th><th>+ Compras</th><th>− Consumo Teórico</th><th>= Esperado</th><th>Conteo Real Final</th><th>Merma</th><th>Merma ($)</th>
                        </tr></thead><tbody>`;
                    data.reporte.forEach(r => {
                        const esperado = r.conteo_inicial + r.compras - r.consumo_teorico;
                        const esSignificativa = r.merma_valor > 20 && (r.merma_pct === null || Math.abs(r.merma_pct) > 5);
                        const color = r.merma > 0 ? (esSignificativa ? 'var(--color-brand)' : 'var(--color-warning)') : 'var(--color-text-muted)';

                            <td style="font-weight:500;">${r.nombre_insumo}</td>
                            <td>${r.conteo_inicial.toFixed(2)} ${r.unidad}</td>
                            <td>${r.compras.toFixed(2)}</td>
                            <td>${r.consumo_teorico.toFixed(2)}</td>
                            <td>${esperado.toFixed(2)}</td>
                            <td>${r.conteo_final.toFixed(2)}</td>
                            <td style="font-weight:bold; color:${color};">${r.merma > 0 ? '+' : ''}${r.merma.toFixed(2)} ${r.unidad}${r.merma_pct !== null ? ` (${r.merma_pct > 0 ? '+' : ''}${r.merma_pct.toFixed(1)}%)` : ''}</td>
                            <td style="font-weight:bold; color:${color};">${money(r.merma_valor)}</td>
                        </tr>`;
                    });
                    html += '</tbody></table></div>';
                    resultadosDiv.innerHTML = html;

                    if (top.length > 0) {
                        const color = metricColor();
                        const opts = baseChartOptions(true);
                        const chart = new Chart(document.getElementById('chart-merma'), {
                            type: 'bar',
                            data: {
                                labels: top.map(r => r.nombre_insumo),
                                datasets: [{ data: top.map(r => r.merma_valor), backgroundColor: color, borderRadius: 4, maxBarThickness: 24 }]
                            },

                    mensajeElemento.textContent = 'Reporte de merma generado.';
                    mensajeElemento.style.color = 'var(--color-success)';

            };

            // Horas Pico (mapa de calor día × hora, para decisiones de personal)
            const generarReporteHorasPico = async (fechaInicio, fechaFin) => {
                resultadosDiv.innerHTML = '<h4>Calculando horas pico...</h4>';
                resultadosDiv.style.display = 'block';
                const url = `${API_URL}/horas-pico?fechaInicio=${fechaInicio}&fechaFin=${fechaFin}`;
                try {
                    const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Error al calcular horas pico');
                    if (!data.celdas || data.celdas.length === 0) { resultadosDiv.innerHTML = '<p>No hay pedidos entregados en este periodo.</p>'; return; }

                    const DIAS = [
                        { dow: 1, nombre: 'Lunes' }, { dow: 2, nombre: 'Martes' }, { dow: 3, nombre: 'Miércoles' },
                        { dow: 4, nombre: 'Jueves' }, { dow: 5, nombre: 'Viernes' }, { dow: 6, nombre: 'Sábado' }, { dow: 0, nombre: 'Domingo' }
                    ];
                    const celda = {};
                    data.celdas.forEach(c => { celda[`${c.dia_semana}-${c.hora}`] = c; });

                    let horaMin = 23, horaMax = 0;
                    data.celdas.forEach(c => { if (c.pedidos > 0) { horaMin = Math.min(horaMin, c.hora); horaMax = Math.max(horaMax, c.hora); } });
                    const horas = [];
                    for (let h = horaMin; h <= horaMax; h++) horas.push(h);

                    const totalPorHora = {}; const totalPorDia = {};
                    let totalPedidos = 0, maxCelda = 0;
                    DIAS.forEach(d => totalPorDia[d.dow] = 0);
                    horas.forEach(h => totalPorHora[h] = 0);
                    data.celdas.forEach(c => {
                        totalPedidos += c.pedidos;
                        if (totalPorDia[c.dia_semana] !== undefined) totalPorDia[c.dia_semana] += c.pedidos;
                        if (totalPorHora[c.hora] !== undefined) totalPorHora[c.hora] += c.pedidos;
                        if (c.pedidos > maxCelda) maxCelda = c.pedidos;
                    });

                    const horaPico = Object.keys(totalPorHora).reduce((best, h) => totalPorHora[h] > (totalPorHora[best] ?? -1) ? h : best, horas[0]);
                    const diaPicoDow = Object.keys(totalPorDia).reduce((best, d) => totalPorDia[d] > (totalPorDia[best] ?? -1) ? d : best, String(DIAS[0].dow));
                    const diaPicoNombre = DIAS.find(d => String(d.dow) === String(diaPicoDow))?.nombre || '—';

                    let html = `
                        <h4>Horas Pico (${fechaInicio} al ${fechaFin})</h4>
                        <p style="font-size:0.9em; color:var(--color-text-muted); margin-bottom:20px;">* Basado en pedidos Entregados. Más oscuro = más pedidos en esa hora/día.</p>
                        <div style="display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap;">
                            <div style="flex:1; min-width:200px; background: var(--color-surface-alt); padding:15px; border-radius:10px; border-left:5px solid var(--color-border);">
                                <small>Hora Pico</small>
                                <div style="font-size:22px; font-weight:bold;">${String(horaPico).padStart(2,'0')}:00 - ${String(Number(horaPico)+1).padStart(2,'0')}:00</div>
                            </div>
                            <div style="flex:1; min-width:200px; background: var(--color-surface-alt); padding:15px; border-radius:10px; border-left:5px solid var(--color-border);">
                                <small>Día Más Ocupado</small>
                                <div style="font-size:22px; font-weight:bold;">${diaPicoNombre}</div>
                            </div>
                            <div style="flex:1; min-width:200px; background: var(--color-surface-alt); padding:15px; border-radius:10px; border-left:5px solid var(--color-border);">
                                <small>Total de Pedidos</small>
                                <div style="font-size:22px; font-weight:bold;">${totalPedidos}</div>
                            </div>
                        </div>
                        <div style="overflow-x:auto;">
                        <table class="heatmap-table"><thead><tr><th></th>`;
                    horas.forEach(h => { html += `<th>${String(h).padStart(2,'0')}h</th>`; });
                    html += `<th>Total</th></tr></thead><tbody>`;
                    DIAS.forEach(d => {
                        html += `<tr><td class="heatmap-label">${d.nombre}</td>`;
                        horas.forEach(h => {
                            const c = celda[`${d.dow}-${h}`];
                            const pedidos = c ? c.pedidos : 0;
                            const venta = c ? c.venta : 0;
                            const t = maxCelda > 0 ? pedidos / maxCelda : 0;
                            html += `<td style="background:${heatColor(t)}; color:${heatTextColor(t)};" title="${d.nombre} ${String(h).padStart(2,'0')}:00 — ${pedidos} pedido(s), ${money(venta)}">${pedidos || ''}</td>`;
                        });
                        html += `<td class="heatmap-total">${totalPorDia[d.dow] || 0}</td></tr>`;
                    });
                    html += `<tr><td class="heatmap-label">Total</td>`;
                    horas.forEach(h => { html += `<td class="heatmap-total">${totalPorHora[h] || 0}</td>`; });
                    html += `<td class="heatmap-total">${totalPedidos}</td></tr>`;
                    html += `</tbody></table></div>`;

                    html += `<h4 style="margin-top:30px;">Pedidos por Hora (todo el periodo)</h4>
                        <div class="chart-wrap"><canvas id="chart-horas-pico"></canvas></div>`;

                    resultadosDiv.innerHTML = html;

                    const color = metricColor();
                    const opts = baseChartOptions(false);
                    const chart = new Chart(document.getElementById('chart-horas-pico'), {
                        type: 'bar',
                        data: {
                            labels: horas.map(h => `${String(h).padStart(2,'0')}h`),
                            datasets: [{ data: horas.map(h => totalPorHora[h] || 0), backgroundColor: color, borderRadius: 4, maxBarThickness: 32 }]
                        },
                        options: {
                            ...opts,
                            plugins: { ...opts.plugins, tooltip: { ...opts.plugins.tooltip, callbacks: { label: (c) => `${c.parsed.y} pedidos` } } }
                        }
                    });
                    activeCharts.push(chart);

                    mensajeElemento.textContent = 'Reporte de horas pico generado.';
                    mensajeElemento.style.color = 'var(--color-success)';
                } catch (error) { resultadosDiv.innerHTML = `<p style="color:var(--color-brand); font-weight:bold;">${error.message}</p>`; }
            };

            // Top Clientes (histórico, ver comentario del endpoint sobre por qué no es por fecha)
            const generarReporteTopClientes = async () => {
                resultadosDiv.innerHTML = '<h4>Cargando clientes...</h4>';
                resultadosDiv.style.display = 'block';
                try {
                    const response = await fetch(`${API_URL}/top-clientes`, { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Error al obtener clientes');
                    const clientes = data.clientes || [];
                    if (clientes.length === 0) { resultadosDiv.innerHTML = '<p>Aún no hay clientes registrados en el CRM.</p>'; return; }

                    const gastoTotalHistorico = clientes.reduce((s, c) => s + c.total_gastado, 0);
                    const visitasTotales = clientes.reduce((s, c) => s + c.visitas, 0);
                    const ticketPromedioGeneral = visitasTotales > 0 ? gastoTotalHistorico / visitasTotales : 0;

                    const topGasto = [...clientes].sort((a, b) => b.total_gastado - a.total_gastado).slice(0, 10);
                    const topVisitas = [...clientes].sort((a, b) => b.visitas - a.visitas).slice(0, 10);
                    const enRiesgo = clientes.filter(c => c.visitas >= 2 && c.dias_desde_ultima_visita !== null)
                        .sort((a, b) => b.dias_desde_ultima_visita - a.dias_desde_ultima_visita).slice(0, 10);

                    let html = `
                        <h4>Top Clientes (histórico, todo el tiempo)</h4>
                        <p style="font-size:0.9em; color:var(--color-text-muted); margin-bottom:20px;">* No es por rango de fechas: refleja el gasto/visitas acumulados de siempre por teléfono.</p>
                        <div style="display:flex; gap:15px; margin-bottom:25px; flex-wrap:wrap;">
                            <div style="flex:1; min-width:200px; background: var(--color-surface-alt); padding:15px; border-radius:10px; border-left:5px solid var(--color-border);">
                                <small>Clientes Registrados</small>
                                <div style="font-size:22px; font-weight:bold;">${clientes.length}</div>
                            </div>
                            <div style="flex:1; min-width:200px; background: var(--color-surface-alt); padding:15px; border-radius:10px; border-left:5px solid var(--color-border);">
                                <small>Gasto Total Histórico</small>
                                <div style="font-size:22px; font-weight:bold;">${money(gastoTotalHistorico)}</div>
                            </div>
                            <div style="flex:1; min-width:200px; background: var(--color-surface-alt); padding:15px; border-radius:10px; border-left:5px solid var(--color-border);">
                                <small>Ticket Promedio General</small>
                                <div style="font-size:22px; font-weight:bold;">${money(ticketPromedioGeneral)}</div>
                            </div>
                        </div>

                        <h4>🏆 Top 10 por Gasto Total</h4>
                        <div class="chart-wrap" style="height:260px;"><canvas id="chart-top-gasto"></canvas></div>
                        <div style="overflow-x:auto; margin-bottom:30px;"><table><thead><tr>
                            <th>Cliente</th><th>Teléfono</th><th>Visitas</th><th>Gasto Total</th><th>Ticket Promedio</th>
                        </tr></thead><tbody>
                            ${topGasto.map(c => `<tr>
                                <td style="font-weight:500;">${c.nombre}</td><td>${c.telefono}</td><td>${c.visitas}</td>
                                <td style="font-weight:bold; color:var(--color-success);">${money(c.total_gastado)}</td><td>${money(c.ticket_promedio)}</td>
                            </tr>`).join('')}
                        </tbody></table></div>

                        <h4>🔁 Top 10 por Frecuencia de Visitas</h4>
                        <div style="overflow-x:auto; margin-bottom:30px;"><table><thead><tr>
                            <th>Cliente</th><th>Teléfono</th><th>Visitas</th><th>Gasto Total</th><th>Ticket Promedio</th>
                        </tr></thead><tbody>
                            ${topVisitas.map(c => `<tr>
                                <td style="font-weight:500;">${c.nombre}</td><td>${c.telefono}</td>
                                <td style="font-weight:bold; color:var(--color-brand);">${c.visitas}</td>
                                <td>${money(c.total_gastado)}</td><td>${money(c.ticket_promedio)}</td>
                            </tr>`).join('')}
                        </tbody></table></div>

                        <h4>⚠️ Clientes en Riesgo (no han vuelto)</h4>
                        <p style="font-size:0.85em; color:var(--color-text-muted); margin-bottom:10px;">Clientes con 2+ visitas históricas ordenados por más tiempo sin volver — candidatos a una llamada o promo de "te extrañamos".</p>
                        ${enRiesgo.length === 0 ? '<p style="color:var(--color-text-muted);">No hay suficientes clientes recurrentes todavía para esta vista.</p>' : `
                        <div style="overflow-x:auto;"><table><thead><tr>
                            <th>Cliente</th><th>Teléfono</th><th>Última Visita</th><th>Días sin Volver</th><th>Visitas Históricas</th><th>Gasto Total</th>
                        </tr></thead><tbody>
                            ${enRiesgo.map(c => `<tr>
                                <td style="font-weight:500;">${c.nombre}</td><td>${c.telefono}</td>
                                <td>${c.ultima_visita ? c.ultima_visita.slice(0,10) : '—'}</td>
                                <td style="font-weight:bold; color:var(--color-brand);">${c.dias_desde_ultima_visita} días</td>
                                <td>${c.visitas}</td><td>${money(c.total_gastado)}</td>
                            </tr>`).join('')}
                        </tbody></table></div>`}
                    `;
                    resultadosDiv.innerHTML = html;

                    const color = metricColor();
                    const opts = baseChartOptions(true);
                    const chart = new Chart(document.getElementById('chart-top-gasto'), {
                        type: 'bar',
                        data: {
                            labels: topGasto.map(c => c.nombre),
                            datasets: [{ data: topGasto.map(c => c.total_gastado), backgroundColor: color, borderRadius: 4, maxBarThickness: 24 }]
                        },
                        options: {
                            ...opts,
                            scales: { ...opts.scales, x: { ...opts.scales.x, ticks: { ...opts.scales.x.ticks, callback: (v) => '$' + v.toLocaleString('es-MX') } } },
                            plugins: { ...opts.plugins, tooltip: { ...opts.plugins.tooltip, callbacks: { label: (c) => money(c.parsed.x) } } }
                        }
                    });
                    activeCharts.push(chart);

                    mensajeElemento.textContent = 'Reporte de clientes generado.';
                    mensajeElemento.style.color = 'var(--color-success)';
                } catch (error) { resultadosDiv.innerHTML = `<p style="color:var(--color-brand); font-weight:bold;">${error.message}</p>`; }
            };

            // Costeo de Menú (ficha de costeo por producto: costo de receta vs. precio de venta,
            // histórico/sin fecha — no depende de ventas, ver comentario del endpoint)
            const generarReporteCosteoMenu = async () => {
                resultadosDiv.innerHTML = '<h4>Calculando costeo de menú...</h4>';
                resultadosDiv.style.display = 'block';
                try {
                    const response = await fetch(`${API_URL}/costeo-menu`, { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Error al calcular el costeo de menú');
                    const productos = data.productos || [];
                    if (productos.length === 0) { resultadosDiv.innerHTML = '<p>No hay productos en el menú.</p>'; return; }

                    const evaluables = productos.filter(p => !p.sin_receta && !p.costo_incompleto);
                    const margenPromedioPct = evaluables.length > 0 ? evaluables.reduce((s, p) => s + p.margen_pct, 0) / evaluables.length : 0;
                    const conPerdida = evaluables.filter(p => p.margen <= 0);
                    const peores = evaluables.slice(0, 10);

                    let html = `
                        <h4>Costeo de Menú (por producto)</h4>
                        <p style="font-size:0.9em; color:var(--color-text-muted); margin-bottom:20px;">* Costo teórico de receta (sin modificadores) contra el precio de venta actual del menú — no depende de ventas ni de un periodo. Ordenado de peor a mejor margen %.</p>
                        <div style="display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap;">
                            <div style="flex:1; min-width:200px; background: var(--color-surface-alt); padding:15px; border-radius:10px; border-left:5px solid var(--color-border);">
                                <small>Productos Evaluados</small>
                                <div style="font-size:22px; font-weight:bold;">${evaluables.length}</div>
                            </div>
                            <div style="flex:1; min-width:200px; background: var(--color-surface-alt); padding:15px; border-radius:10px; border-left:5px solid var(--color-border);">
                                <small>Margen Promedio</small>
                                <div style="font-size:22px; font-weight:bold;">${margenPromedioPct.toFixed(1)}%</div>
                            </div>
                            <div style="flex:1; min-width:200px; background: ${conPerdida.length > 0 ? 'var(--color-brand-tint)' : 'var(--color-surface-alt)'}; padding:15px; border-radius:10px; border-left:5px solid ${conPerdida.length > 0 ? 'var(--color-brand)' : 'var(--color-border)'};">
                                <small>Vendiendo con Pérdida</small>
                                <div style="font-size:22px; font-weight:bold; color:${conPerdida.length > 0 ? 'var(--color-brand)' : 'var(--color-text)'};">${conPerdida.length}</div>
                            </div>
                        </div>`;

                    if (data.productos_sin_receta && data.productos_sin_receta.length > 0) {
                        html += `<p style="font-size:0.85em; color:var(--color-text-muted); margin-bottom:10px;">⚠️ ${data.productos_sin_receta.length} producto(s) sin receta configurada: ${data.productos_sin_receta.join(', ')}.</p>`;
                    }
                    if (data.productos_costo_incompleto && data.productos_costo_incompleto.length > 0) {
                        html += `<p style="font-size:0.85em; color:var(--color-brand); margin-bottom:15px;">⚠️ ${data.productos_costo_incompleto.length} producto(s) con algún insumo sin costo capturado, excluidos del costeo: ${data.productos_costo_incompleto.join(', ')}.</p>`;
                    }

                    if (peores.length > 0) {
                        html += `<div class="chart-wrap" style="height:280px;"><canvas id="chart-costeo-menu"></canvas></div>`;
                    }

                    html += `<div style="overflow-x:auto;"><table><thead><tr>
                        <th>Producto</th><th>Precio de Venta</th><th>Costo de Receta</th><th>Margen</th><th>Margen %</th>
                        </tr></thead><tbody>`;
                    productos.forEach(p => {
                        const sinDatos = p.sin_receta || p.costo_incompleto;
                        const estado = p.sin_receta ? '⚠️ Sin receta' : p.costo_incompleto ? '⚠️ Costo incompleto' : null;
                        const color = sinDatos ? 'var(--color-text-muted)' : (p.margen <= 0 ? 'var(--color-brand)' : (p.margen_pct < 40 ? 'var(--color-warning)' : 'var(--color-success)'));
                        html += `<tr>
                            <td style="font-weight:500;">${p.producto}</td>
                            <td>${money(p.precio_venta)}</td>
                            <td>${sinDatos ? '—' : money(p.costo_receta)}</td>
                            <td style="font-weight:bold; color:${color};">${sinDatos ? (estado || '—') : money(p.margen)}</td>
                            <td style="font-weight:bold; color:${color};">${sinDatos ? '—' : p.margen_pct.toFixed(1) + '%'}</td>
                        </tr>`;
                    });
                    html += '</tbody></table></div>';
                    resultadosDiv.innerHTML = html;

                    if (peores.length > 0) {
                        const opts = baseChartOptions(true);
                        const chart = new Chart(document.getElementById('chart-costeo-menu'), {
                            type: 'bar',
                            data: {
                                labels: peores.map(p => p.producto),
                                datasets: [{
                                    data: peores.map(p => p.margen_pct),
                                    backgroundColor: peores.map(p => p.margen <= 0 ? '#d03b3b' : (p.margen_pct < 40 ? '#fab219' : '#0ca30c')),
                                    borderRadius: 4, maxBarThickness: 24
                                }]
                            },
                            options: {
                                ...opts,
                                scales: { ...opts.scales, x: { ...opts.scales.x, ticks: { ...opts.scales.x.ticks, callback: (v) => v + '%' } } },
                                plugins: { ...opts.plugins, tooltip: { ...opts.plugins.tooltip, callbacks: { label: (c) => c.parsed.x.toFixed(1) + '%' } } }
                            }
                        });
                        activeCharts.push(chart);
                    }

                    mensajeElemento.textContent = 'Costeo de menú generado.';
                    mensajeElemento.style.color = 'var(--color-success)';
                } catch (error) { resultadosDiv.innerHTML = `<p style="color:var(--color-brand); font-weight:bold;">${error.message}</p>`; }
            };

            // --- 5. MANEJADOR DE EVENTOS (BOTÓN GENERAR) ---
            botonGenerar.addEventListener('click', () => {
                const tipoReporte = selectTipoReporte.value;
                const fechaInicio = tipoReporte === 'merma' ? selectFechaInicioMerma.value : inputFechaInicio.value;
                const fechaFin = tipoReporte === 'merma' ? selectFechaFinMerma.value : inputFechaFin.value;

                mensajeElemento.textContent = '';
                resultadosDiv.style.display = 'none';
                destroyCharts();

                if (!tipoReporte) {
                    mensajeElemento.textContent = 'Por favor, selecciona el tipo de reporte.';
                    mensajeElemento.style.color = 'var(--color-brand)';
                    return;
                }

                if (tipoReporte === 'semanal_gerencial') { 
                    if (!fechaInicio || !fechaFin) {
                        mensajeElemento.textContent = 'Selecciona el rango de fechas (ej: Lunes a Domingo).';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    generarReporteSemanal(fechaInicio, fechaFin);
                
                } else if (tipoReporte === 'ventas') {
                    if (!fechaInicio || !fechaFin) {
                        mensajeElemento.textContent = 'Selecciona fecha inicio y fin.';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    generarReporteVentas(fechaInicio, fechaFin);
                
                } else if (tipoReporte === 'platillos') {
                    if (!fechaInicio || !fechaFin) {
                        mensajeElemento.textContent = 'Selecciona fecha inicio y fin.';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    generarReportePlatillos(fechaInicio, fechaFin);

                } else if (tipoReporte === 'margen_platillos') {
                    if (!fechaInicio || !fechaFin) {
                        mensajeElemento.textContent = 'Selecciona fecha inicio y fin.';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    generarReporteMargenPlatillos(fechaInicio, fechaFin);

                } else if (tipoReporte === 'top_clientes') {
                    generarReporteTopClientes();

                } else if (tipoReporte === 'costeo_menu') {
                    generarReporteCosteoMenu();

                } else if (tipoReporte === 'horas_pico') {
                    if (!fechaInicio || !fechaFin) {
                        mensajeElemento.textContent = 'Selecciona fecha inicio y fin.';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    generarReporteHorasPico(fechaInicio, fechaFin);

                } else if (tipoReporte === 'insumos_teoricos') { 
                    if (!fechaInicio || !fechaFin) {
                        mensajeElemento.textContent = 'Selecciona fecha inicio y fin.';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    generarReporteInsumosTeoricos(fechaInicio, fechaFin);

                    } else if (tipoReporte === 'cogs') {
    if (!fechaInicio || !fechaFin) {
        mensajeElemento.textContent = 'Selecciona fecha inicio y fin para calcular el KPI.';
        mensajeElemento.style.color = 'var(--color-brand)';
        return;
    }
    generarReporteCOGS(fechaInicio, fechaFin);

                } else if (tipoReporte === 'tendencia_ventas') {
                    if (!fechaInicio || !fechaFin) {
                        mensajeElemento.textContent = 'Selecciona fecha inicio y fin.';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    generarReporteTendenciaVentas(fechaInicio, fechaFin);

                } else if (tipoReporte === 'tendencia_cogs') {
                    if (!fechaInicio || !fechaFin) {
                        mensajeElemento.textContent = 'Selecciona fecha inicio y fin (idealmente varias semanas) para ver la tendencia.';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    generarReporteTendenciaCOGS(fechaInicio, fechaFin);

                } else if (tipoReporte === 'merma') {
                    if (!fechaInicio || !fechaFin) {
                        mensajeElemento.textContent = 'Selecciona el conteo inicial y el conteo final.';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    if (fechaInicio >= fechaFin) {
                        mensajeElemento.textContent = 'El conteo final debe ser posterior al conteo inicial.';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    generarReporteMerma(fechaInicio, fechaFin);

                } else if (tipoReporte === 'historico_inventario') {
                    if (!fechaInicio) {
                        mensajeElemento.textContent = 'Selecciona la fecha de registro.';
                        mensajeElemento.style.color = 'var(--color-brand)';
                        return;
                    }
                    generarReporteHistorico(fechaInicio);
                }


                setTimeout(() => { mensajeElemento.textContent = ''; }, 5000);
            });

            cargarResumenHoy();
        });
    </script>
</body>
</html>
