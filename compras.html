<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Olimpollo - Compras</title>
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--color-surface); padding: 15px 40px; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); }
        header .logo { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-decoration: none; color: var(--color-text); }
        header nav { display: flex; gap: 20px; }
        header nav a { text-decoration: none; color: var(--color-text-muted); font-weight: 600; font-size: 14px; transition: color 0.2s; }
        header nav a:hover { color: var(--color-brand); }
        .user-info { display: flex; align-items: center; gap: 16px; }
        #user-identifier { font-weight: 600; background: var(--color-surface-alt); padding: 5px 12px; border-radius: var(--radius-full); font-size: 13px; }

        main { flex: 1; padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .page-title { margin-bottom: 30px; font-size: 26px; }
        .card { background: var(--color-surface); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow-sm); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--color-border); }
        th { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--color-text-muted); }
        footer { text-align: center; padding: 20px; font-size: 13px; color: var(--color-text-muted); }

        /* ESTILOS ESPECÍFICOS COMPRAS */
        .form-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 15px; align-items: end; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
        .btn-save { width: 100%; font-size: 16px; margin-top: 20px; }
        .total-display { text-align: right; font-size: 1.5em; font-weight: 700; font-family: var(--font-display); margin-top: 20px; color: var(--color-text); }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Olimpollo</a>
        <nav>
            <a href="pedidos.html">POS</a>
            <a href="compras.html" style="color: var(--color-brand);">Compras</a> <a href="inventario.html">Inventario</a>
            <a href="reportes.html">Reportes</a>
        </nav>
        <div class="user-info">
            <span id="user-identifier"></span>
            <button class="btn btn-secondary btn-sm" id="btn-logout">Salir</button>
        </div>
    </header>

    <main>
        <h2 class="page-title ds-display">Registrar Compra de Insumos</h2>

        <div class="card">
            <div class="form-group" style="margin-bottom: 20px; max-width: 300px;">
                <label>Proveedor (Opcional):</label>
                <input type="text" id="proveedor" class="input" placeholder="Ej: Sam's Club, Mercado...">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Insumo:</label>
                    <select id="select-insumo" class="select">
                        <option value="">Cargando insumos...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cantidad a Sumar:</label>
                    <input type="number" id="cantidad" class="input" placeholder="0" min="0.01" step="any">
                    <span class="field-help" id="unidad-label">Unidad</span>
                </div>
                <div class="form-group">
                    <label>Costo Unitario ($):</label>
                    <input type="number" id="costo" class="input" placeholder="0.00" min="0" step="0.01">
                </div>
                <button type="button" id="btn-agregar" class="btn" style="background:var(--color-success); color:#fff;"><i class="fas fa-plus"></i> Agregar</button>
            </div>
        </div>

        <div class="card">
            <h3>Resumen de Compra</h3>
            <table>
                <thead>
                    <tr>
                        <th>Insumo</th>
                        <th>Cantidad</th>
                        <th>Costo Unit.</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-compras-body">
                    </tbody>
            </table>

            <div class="total-display">
                Total: $<span id="total-compra">0.00</span>
            </div>

            <button type="button" id="btn-guardar-compra" class="btn btn-primary btn-lg btn-save"><i class="fas fa-save"></i> Registrar Compra y Actualizar Stock</button>
        </div>
    </main>

    <footer>&copy; 2026 Los Boneless del Olimpo</footer>

    <script src="design-system.js"></script>
    <script>
        (function() {
            const originalFetch = window.fetch;
            window.fetch = async function(...args) {
                const response = await originalFetch(...args);
                if (response.status === 401) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('userRole');
                    if (!location.pathname.endsWith('login.html')) window.location.href = 'login.html';
                }
                return response;
            };
        })();
        // AUTH & UTILS
        function parseJwt(token) { try { return JSON.parse(decodeURIComponent(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))); } catch(e){return null;} }

        document.addEventListener('DOMContentLoaded', async () => {
            const API_URL = 'https://olimpollo-api.onrender.com/api';
            const token = localStorage.getItem('authToken');
            
            if (!token) { window.location.href = 'login.html'; return; }
            const user = parseJwt(token);
            if(user) document.getElementById('user-identifier').textContent = user.username;
            
            document.getElementById('btn-logout').addEventListener('click', () => {
                localStorage.removeItem('authToken'); localStorage.removeItem('userRole'); window.location.href = 'login.html';
            });

            // VARIABLES
            let carritoCompras = [];
            let insumosLista = [];

            // ELEMENTOS
            const selectInsumo = document.getElementById('select-insumo');
            const inputCantidad = document.getElementById('cantidad');
            const inputCosto = document.getElementById('costo');
            const unidadLabel = document.getElementById('unidad-label');
            const tablaBody = document.getElementById('tabla-compras-body');
            const totalDisplay = document.getElementById('total-compra');
            const inputProveedor = document.getElementById('proveedor');

            // 1. CARGAR INSUMOS
            try {
                const res = await fetch(`${API_URL}/inventario`, { headers: { 'Authorization': `Bearer ${token}` } }); // Reutilizamos endpoint de inventario
                insumosLista = await res.json();
                
                selectInsumo.innerHTML = '<option value="">Selecciona un insumo...</option>';
                insumosLista.forEach(insumo => {
                    const opt = document.createElement('option');
                    opt.value = insumo.id;
                    opt.textContent = `${insumo.nombre} (${insumo.unidad})`;
                    opt.dataset.unidad = insumo.unidad;
                    selectInsumo.appendChild(opt);
                });
            } catch (err) { console.error(err); }

            // Listener cambio de insumo para mostrar unidad
            selectInsumo.addEventListener('change', () => {
                const selected = selectInsumo.options[selectInsumo.selectedIndex];
                unidadLabel.textContent = selected.dataset.unidad || 'Unidad';
            });

            // 2. AGREGAR AL CARRITO
            document.getElementById('btn-agregar').addEventListener('click', () => {
                const insumoId = selectInsumo.value;
                const cantidad = parseFloat(inputCantidad.value);
                const costo = parseFloat(inputCosto.value);

                if (!insumoId || isNaN(cantidad) || cantidad <= 0 || isNaN(costo) || costo < 0) {
                    return DS.toast('Por favor completa los datos correctamente.', { type: 'warning' });
                }

                const insumoNombre = selectInsumo.options[selectInsumo.selectedIndex].text;

                carritoCompras.push({
                    insumo_id: insumoId,
                    nombre: insumoNombre,
                    cantidad: cantidad,
                    costo_unitario: costo,
                    subtotal: cantidad * costo
                });

                renderTabla();
                inputCantidad.value = '';
                inputCosto.value = '';
                selectInsumo.focus();
            });

            // 3. RENDERIZAR TABLA
            function renderTabla() {
                tablaBody.innerHTML = '';
                let total = 0;

                carritoCompras.forEach((item, index) => {
                    total += item.subtotal;
                    const row = `
                        <tr>
                            <td>${item.nombre}</td>
                            <td>${item.cantidad}</td>
                            <td>$${item.costo_unitario.toFixed(2)}</td>
                            <td>$${item.subtotal.toFixed(2)}</td>
                            <td><button type="button" class="btn btn-danger-outline btn-sm" onclick="eliminarItem(${index})"><i class="fas fa-trash"></i></button></td>
                        </tr>
                    `;
                    tablaBody.innerHTML += row;
                });

                totalDisplay.textContent = total.toFixed(2);
            }

            // Hacer global la funcion eliminar
            window.eliminarItem = (index) => {
                carritoCompras.splice(index, 1);
                renderTabla();
            };

            // 4. GUARDAR COMPRA
            document.getElementById('btn-guardar-compra').addEventListener('click', async () => {
                if (carritoCompras.length === 0) return DS.toast('La lista de compra está vacía.', { type: 'warning' });

                const btn = document.getElementById('btn-guardar-compra');
                btn.disabled = true;
                btn.textContent = "Procesando...";
                const restaurarBoton = () => { btn.innerHTML = '<i class="fas fa-save"></i> Registrar Compra y Actualizar Stock'; };

                const data = {
                    proveedor: inputProveedor.value.trim() || 'Varios',
                    total_compra: parseFloat(totalDisplay.textContent),
                    items: carritoCompras
                };

                try {
                    const response = await fetch(`${API_URL}/compras`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (response.ok) {
                        await DS.notice('Compra registrada con éxito. El inventario ha sido actualizado.', { title: 'Éxito' });
                        carritoCompras = [];
                        renderTabla();
                        inputProveedor.value = '';
                    } else {
                        DS.toast('Error: ' + (result.error || 'No se pudo guardar'), { type: 'error', duration: 0 });
                    }
                } catch (error) {
                    DS.toast('Error de conexión.', { type: 'error', duration: 0 });
                } finally {
                    btn.disabled = false;
                    restaurarBoton();
                }
            });
        });
    </script>
</body>
</html>
