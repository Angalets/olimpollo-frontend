<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olimpollo - Panel Principal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="design-system.css">

  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }

    header {
      background: var(--color-surface);
      padding: 15px 40px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-border);
    }
    .logo { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--color-text); }
    .user-info { display: flex; align-items: center; gap: var(--space-5); }
    #user-identifier { font-weight: 600; background: var(--color-surface-alt); padding: 5px 12px; border-radius: var(--radius-full); font-size: 13px; }

    main { flex: 1; padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
    .welcome-message { margin: 0 0 6px; font-size: 28px; }
    .date-display { margin: 0 0 var(--space-8); color: var(--color-text-muted); font-size: 14px; text-transform: capitalize; }

    /* WIDGETS */
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-5); margin-bottom: var(--space-10); }
    .stat-card {
      display: flex; align-items: center; gap: var(--space-5);
      padding: var(--space-5);
      border-left: 4px solid var(--color-border);
    }
    .stat-card.sales { border-left-color: var(--color-success); }
    .stat-card.orders { border-left-color: var(--color-warning); }
    .stat-card.stock { border-left-color: var(--color-brand); }
    .stat-icon {
      flex-shrink: 0;
      width: 52px; height: 52px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      background: var(--color-surface-alt); color: var(--color-text-muted);
    }
    .stat-card.sales .stat-icon { background: var(--color-success-tint); color: var(--color-success); }
    .stat-card.orders .stat-icon { background: var(--color-warning-tint); color: var(--color-warning); }
    .stat-card.stock .stat-icon { background: var(--color-brand-tint); color: var(--color-brand); }
    .stat-info h3 { margin: 0; font-size: 12px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-info p { margin: 4px 0 0; font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--color-text); }
    .stat-info small { font-size: 12px; color: var(--color-text-muted); }
    .stat-stock-alert .stat-info p { color: var(--color-brand); }

    /* MENU DASHBOARD */
    .section-title { margin-bottom: var(--space-5); font-size: 16px; font-weight: 600; color: var(--color-text-muted); }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--space-5); }
    .dashboard-card {
      color: var(--color-text);
      text-decoration: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--space-3);
      padding: var(--space-6);
      aspect-ratio: 1 / 1;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .dashboard-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--color-brand); }
    .dashboard-card i { font-size: 36px; color: var(--color-brand); }
    .dashboard-card span { font-size: 14px; font-weight: 600; text-align: center; }

    footer { text-align: center; padding: 20px; font-size: 13px; color: var(--color-text-muted); margin-top: auto; }
  </style>
</head>
<body>
<header>
    <div class="logo">Olimpollo</div>
    <div class="user-info">
        <span id="user-identifier"></span>
        <button class="btn btn-secondary btn-sm" id="btn-logout">Cerrar Sesión</button>
    </div>
</header>

<main>
    <div>
        <h2 class="welcome-message" id="welcome-title">Bienvenido</h2>
        <p class="date-display" id="current-date">Cargando fecha...</p>
    </div>

    <div class="stats-container" id="stats-panel" style="display: none;">

        <div class="stat-card card sales">
            <div class="stat-icon"><i class="fas fa-dollar-sign"></i></div>
            <div class="stat-info">
                <h3>Ventas Netas del Turno</h3> <p id="stat-ventas">Cargando...</p>
                <small id="stat-pedidos-count">0 pedidos entregados</small>
            </div>
        </div>

        <div class="stat-card card orders">
            <div class="stat-icon"><i class="fas fa-clock"></i></div>
            <div class="stat-info">
                <h3>Pendientes</h3>
                <p id="stat-pendientes">Cargando...</p>
                <small>En cocina o preparación</small>
            </div>
        </div>

        <div class="stat-card card stock" id="stat-stock-card">
            <div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <div class="stat-info">
                <h3>Stock Bajo</h3>
                <p id="stat-stock">Cargando...</p>
                <small>Insumos críticos</small>
            </div>
        </div>

    </div>

    <h3 class="section-title">Módulos de Gestión</h3>
    <div class="dashboard-grid card" id="panel-modulos" style="display: grid; padding: var(--space-6);">
        </div>
</main>

<footer>
    &copy; 2026 Los Boneless del Olimpo - Software de Gestión
</footer>

<script src="design-system.js"></script>
<script>
    (function() {
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            const response = await originalFetch(...args);
            if (response.status === 401) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('userRole');
                if (!location.pathname.endsWith('login.html')) window.location.href = 'login.html';
            }
            return response;
        };
    })();
    const API_URL = 'https://olimpollo-api.onrender.com/api';

    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) { return null; }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('authToken');
        const role = localStorage.getItem('userRole');

        if (!token || !role) {
            window.location.href = 'login.html';
            return;
        }

        const userData = parseJwt(token);
        const username = userData ? userData.username : 'Usuario';

        document.getElementById('user-identifier').textContent = username;
        document.getElementById('welcome-title').textContent = `Hola, ${username} 👋`;

        // Mostrar fecha actual bonita
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('es-ES', options);

        const panel = document.getElementById('panel-modulos');

        // --- DEFINICIÓN DE MÓDULOS ---
        const modulos = [
            { text: 'Nuevo Pedido (POS)', href: 'pedidos.html', roles: ['Administrador', 'Gerente', 'Empleado'], icon: 'fa-cash-register' },
            { text: 'Mapa de Mesas', href: 'mesas.html', roles: ['Administrador', 'Gerente', 'Empleado'], icon: 'fa-chair' },
            { text: 'Corte de Caja', href: 'corte.html', roles: ['Administrador', 'Gerente', 'Empleado'], icon: 'fa-file-invoice-dollar' },
            { text: 'Cocina (Comanda)', href: 'comanda.html', roles: ['Administrador', 'Gerente', 'Empleado'], icon: 'fa-receipt' },
            { text: 'Clientes (CRM)', href: 'clientes.html', roles: ['Administrador', 'Gerente', 'Empleado'], icon: 'fa-address-book' },
            { text: 'Historial Pedidos', href: 'pedidos_lista.html', roles: ['Administrador', 'Gerente'], icon: 'fa-clipboard-list' },
            { text: 'Producción', href: 'produccion.html', roles: ['Administrador', 'Gerente'], icon: 'fa-industry' },
            { text: 'Compras / Re-stock', href: 'compras.html', roles: ['Administrador', 'Gerente'], icon: 'fa-cart-shopping' },
            { text: 'Inventario', href: 'inventario.html', roles: ['Administrador', 'Gerente'], icon: 'fa-boxes-stacked' },
            { text: 'Reportes', href: 'reportes.html', roles: ['Administrador', 'Gerente'], icon: 'fa-chart-line' },
            { text: 'Recetas', href: 'recetas.html', roles: ['Administrador'], icon: 'fa-book-open' },
            { text: 'Menú', href: 'menu_gestion.html', roles: ['Administrador'], icon: 'fa-utensils' },
            { text: 'Finanzas', href: 'finanzas.html', roles: ['Administrador'], icon: 'fa-sack-dollar' },
            { text: 'Usuarios', href: 'usuarios.html', roles: ['Administrador'], icon: 'fa-users-cog' }
        ];

        // Renderizar Módulos
        modulos.forEach(mod => {
            if (mod.roles.includes(role)) {
                const link = document.createElement('a');
                link.href = mod.href;
                link.className = 'dashboard-card';
                link.innerHTML = `<i class="fas ${mod.icon}"></i><span>${mod.text}</span>`;
                panel.appendChild(link);
            }
        });

        // --- LÓGICA DEL DASHBOARD (MÉTRICAS) ---
        if (role === 'Administrador' || role === 'Gerente') {
            document.getElementById('stats-panel').style.display = 'grid';
            cargarMetricas();
        }

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userRole');
            window.location.href = 'login.html';
        });
    });

    async function cargarMetricas() {
        const authHeaders = { headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` } };
        try {
            // A. VENTAS DEL TURNO (NUEVO ENDPOINT QUE CREAMOS)
            const resVentas = await fetch(`${API_URL}/reportes/ventas-turno`, authHeaders);

            if (resVentas.ok) {
                const dataVentas = await resVentas.json();

                // CÁLCULO NETO
                const ventasBrutas = parseFloat(dataVentas.ventas_totales || 0);
                const comisiones = parseFloat(dataVentas.comisiones || 0);
                const ventasNetas = ventasBrutas - comisiones;

                document.getElementById('stat-ventas').textContent = `$${ventasNetas.toFixed(2)}`;
                document.getElementById('stat-pedidos-count').textContent = `${dataVentas.total_pedidos || 0} pedidos entregados`;
            } else {
                document.getElementById('stat-ventas').textContent = '$0.00';
            }

            // B. PEDIDOS PENDIENTES
            const resPedidos = await fetch(`${API_URL}/pedidos`, authHeaders);

            if (resPedidos.ok) {
                let dataPedidos = await resPedidos.json();
                if(Array.isArray(dataPedidos)) {
                    // Filtramos los que NO están Entregados ni Cancelados
                    const pendientes = dataPedidos.filter(p => p.estado === 'Pendiente' || p.estado === 'En Preparación').length;
                    document.getElementById('stat-pendientes').textContent = pendientes;
                }
            } else {
                document.getElementById('stat-pendientes').textContent = '-';
            }

            // C. STOCK BAJO
            const resStock = await fetch(`${API_URL}/inventario`, authHeaders);
            if (resStock.ok) {
                const dataStock = await resStock.json();
                if(Array.isArray(dataStock)) {
                    // Filtramos donde la cantidad sea menor o igual al stock mínimo Y mayor a 0
                    const stockBajoCount = dataStock.filter(i => i.cantidad <= i.stock_minimo).length;

                    document.getElementById('stat-stock').textContent = stockBajoCount;
                    if(stockBajoCount > 0) document.getElementById('stat-stock-card').classList.add('stat-stock-alert');
                }
            }

        } catch (error) {
            console.error("Error general cargando dashboard:", error);
        }
    }
</script>
</body>
</html>
