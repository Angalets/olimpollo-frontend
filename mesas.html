<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Olimpollo - Mapa de Mesas</title>
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--color-surface); padding: 15px 40px; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); }
        header .logo { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-decoration: none; color: var(--color-text); }
        header nav { display: flex; gap: 20px; }
        header nav a { text-decoration: none; color: var(--color-text-muted); font-weight: 600; font-size: 14px; transition: color 0.2s; }
        header nav a:hover { color: var(--color-brand); }
        .user-info { display: flex; align-items: center; gap: 16px; }
        #user-identifier { font-weight: 600; background: var(--color-surface-alt); padding: 5px 12px; border-radius: var(--radius-full); font-size: 13px; }

        main { flex: 1; padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .page-title { margin-bottom: 30px; font-size: 26px; }
        footer { text-align: center; padding: 20px; font-size: 13px; color: var(--color-text-muted); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 17, 21, 0.6); justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .modal-content { background: var(--color-surface); color: var(--color-text); padding: 28px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 90%; max-width: 560px; max-height: calc(100vh - 40px); overflow-y: auto; position: relative; margin: auto; }
        .modal-content .close { position: absolute; top: 16px; right: 18px; font-size: 22px; cursor: pointer; color: var(--color-text-muted); background: none; border: none; }
        .modal-content .close:hover { color: var(--color-text); }

        /* Estilos específicos para esta página */
        .action-bar { margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; }
        .mesas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .mesa-tile { border-radius: var(--radius-lg); padding: 20px; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform 0.2s; border: 2px solid transparent; background: var(--color-surface); }
        .mesa-tile:hover { transform: translateY(-4px); }
        .mesa-tile.libre { background-color: var(--color-success-tint); border-color: var(--color-success); }
        .mesa-tile.ocupada-pendiente { background-color: var(--color-warning-tint); border-color: var(--color-warning); }
        .mesa-tile.ocupada-listo { background-color: var(--color-info-tint); border-color: var(--color-info); }
        .mesa-tile .mesa-nombre { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--color-text); }
        .mesa-tile .mesa-estado { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); }
        .mesa-tile .mesa-detalle { margin-top: 8px; font-size: 13px; color: var(--color-text-muted); }
        .mesa-tile .mesa-total { margin-top: 4px; font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--color-text); }
        .fila-editar-mesa { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
        .fila-editar-mesa input { flex: 1; }
        .leyenda { display: flex; gap: 20px; margin-bottom: 20px; font-size: 13px; color: var(--color-text-muted); flex-wrap: wrap; }
        .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
        .leyenda .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Olimpollo</a>
        <nav>
            <a href="pedidos.html">POS</a>
            <a href="reportes.html">Reportes</a>
            <a href="pedidos_lista.html">Pedidos</a>
            <a href="inventario.html">Inventario</a>
        </nav>
        <div class="user-info">
            <span id="user-identifier"></span>
            <button class="btn btn-secondary btn-sm" id="btn-logout">Cerrar Sesión</button>
        </div>
    </header>

    <main>
        <h2 class="page-title ds-display">Mapa de Mesas</h2>

        <div class="leyenda">
            <span><span class="dot" style="background:var(--color-success);"></span> Libre</span>
            <span><span class="dot" style="background:var(--color-warning);"></span> Ocupada · En preparación</span>
            <span><span class="dot" style="background:var(--color-info);"></span> Ocupada · Lista para entregar</span>
        </div>

        <div class="action-bar">
            <button class="btn btn-secondary" id="btn-refrescar"><i class="fas fa-rotate"></i> Actualizar</button>
            <button class="btn btn-primary" id="btn-administrar" style="display:none;"><i class="fas fa-sliders"></i> Administrar Mesas</button>
        </div>

        <div class="mesas-grid" id="mesas-grid"></div>
    </main>

    <div id="modalAdmin" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <button type="button" class="close">&times;</button>
            <h3>Administrar Mesas</h3>
            <div id="lista-admin-mesas" style="margin: 20px 0; max-height: 300px; overflow-y: auto;"></div>
            <form id="form-nueva-mesa" style="display: flex; gap: 10px;">
                <input type="text" id="nombre-nueva-mesa" class="input" placeholder="Nombre de la mesa (ej. Mesa 9)" required style="flex:1;">
                <button type="submit" class="btn btn-primary">Agregar</button>
            </form>
        </div>
    </div>

    <footer>&copy; 2026 Los Boneless del Olimpo</footer>

    <script src="design-system.js"></script>
    <script>
        (function() {
            const originalFetch = window.fetch;
            window.fetch = async function(...args) {
                const response = await originalFetch(...args);
                if (response.status === 401) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('userRole');
                    if (!location.pathname.endsWith('login.html')) window.location.href = 'login.html';
                }
                return response;
            };
        })();

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const API_URL = 'https://olimpollo-api.onrender.com/api/mesas';
            const API_PEDIDOS_URL = 'https://olimpollo-api.onrender.com/api/pedidos';
            const grid = document.getElementById('mesas-grid');
            const modalAdmin = document.getElementById('modalAdmin');
            const listaAdminMesas = document.getElementById('lista-admin-mesas');
            const formNuevaMesa = document.getElementById('form-nueva-mesa');

            const token = localStorage.getItem('authToken');
            const role = localStorage.getItem('userRole');
            if (!token) { window.location.href = 'login.html'; return; }

            const userData = parseJwt(token);
            if (userData && userData.username) {
                document.getElementById('user-identifier').textContent = userData.username;
            }

            if (role === 'Administrador') {
                document.getElementById('btn-administrar').style.display = 'inline-block';
            }

            document.getElementById('btn-logout').addEventListener('click', () => {
                localStorage.removeItem('authToken');
                localStorage.removeItem('userRole');
                window.location.href = 'login.html';
            });

            let mesas = [];

            const fetchMesas = async () => {
                try {
                    const response = await fetch(API_URL, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (!response.ok) throw new Error('Error al cargar las mesas.');
                    mesas = await response.json();
                    renderMesas();
                } catch (error) {
                    console.error('Error:', error);
                    grid.innerHTML = '<p style="color:var(--color-brand);">No se pudieron cargar las mesas.</p>';
                }
            };

            const renderMesas = () => {
                if (mesas.length === 0) {
                    grid.innerHTML = '<p style="color: var(--color-text-muted);">Aún no hay mesas configuradas. Usa "Administrar Mesas" para agregar la primera.</p>';
                    return;
                }
                grid.innerHTML = '';
                mesas.forEach(m => {
                    const ocupada = !!m.pedido_id;
                    const estadoClase = !ocupada ? 'libre' : (m.estado === 'Listo' ? 'ocupada-listo' : 'ocupada-pendiente');
                    const tile = document.createElement('div');
                    tile.className = `mesa-tile ${estadoClase}`;
                    tile.innerHTML = `
                        <div class="mesa-nombre">${m.nombre}</div>
                        <div class="mesa-estado">${ocupada ? m.estado : 'Libre'}</div>
                        ${ocupada ? `
                            <div class="mesa-detalle">${m.cliente}</div>
                            <div class="mesa-total">$${parseFloat(m.total).toFixed(2)}</div>
                        ` : ''}
                    `;
                    tile.addEventListener('click', () => ocupada ? abrirPedidoExistente(m.pedido_id) : abrirMesaNueva(m));
                    grid.appendChild(tile);
                });
            };

            const abrirMesaNueva = (mesa) => {
                const params = new URLSearchParams({ mesa_id: mesa.id, mesa_nombre: mesa.nombre });
                window.location.href = `pedidos.html?${params.toString()}`;
            };

            const abrirPedidoExistente = async (pedidoId) => {
                try {
                    const response = await fetch(`${API_PEDIDOS_URL}?id=${pedidoId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (!response.ok) throw new Error('Error al cargar el pedido de la mesa.');
                    const pedidos = await response.json();
                    if (pedidos.length === 0) throw new Error('El pedido ya no existe.');
                    localStorage.setItem('editPedidoData', JSON.stringify(pedidos[0]));
                    window.location.href = 'pedidos.html';
                } catch (error) {
                    console.error('Error:', error);
                    DS.toast('No se pudo abrir el pedido de la mesa: ' + error.message, { type: 'error', duration: 0 });
                }
            };

            document.getElementById('btn-refrescar').addEventListener('click', fetchMesas);

            // --- ADMINISTRACIÓN DE MESAS (solo Administrador) ---
            const renderAdminMesas = () => {
                listaAdminMesas.innerHTML = '';
                mesas.forEach(m => {
                    const fila = document.createElement('div');
                    fila.className = 'fila-editar-mesa';
                    fila.innerHTML = `
                        <input type="text" value="${m.nombre}" data-id="${m.id}" class="input input-renombrar-mesa">
                        <button type="button" class="btn btn-secondary btn-sm btn-guardar-mesa" data-id="${m.id}">Guardar</button>
                        <button type="button" class="btn btn-danger-outline btn-sm btn-quitar-mesa" data-id="${m.id}" ${m.pedido_id ? 'disabled title="Tiene un pedido abierto"' : ''}>Quitar</button>
                    `;
                    listaAdminMesas.appendChild(fila);
                });
            };

            document.getElementById('btn-administrar').addEventListener('click', () => {
                renderAdminMesas();
                modalAdmin.style.display = 'flex';
            });

            listaAdminMesas.addEventListener('click', async (e) => {
                const id = e.target.dataset.id;
                if (!id) return;

                if (e.target.classList.contains('btn-guardar-mesa')) {
                    const input = listaAdminMesas.querySelector(`.input-renombrar-mesa[data-id="${id}"]`);
                    const nombre = input.value.trim();
                    if (!nombre) return DS.toast('El nombre no puede estar vacío.', { type: 'warning' });
                    try {
                        const response = await fetch(`${API_URL}/${id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                            body: JSON.stringify({ nombre })
                        });
                        const data = await response.json();
                        if (!response.ok) throw new Error(data.error || 'Error al renombrar la mesa.');
                        await fetchMesas();
                        renderAdminMesas();
                    } catch (error) {
                        DS.toast('Error: ' + error.message, { type: 'error', duration: 0 });
                    }
                }

                if (e.target.classList.contains('btn-quitar-mesa')) {
                    const ok = await DS.confirm('¿Quitar esta mesa? No se podrá usar en el mapa, pero su historial de pedidos se conserva.', { title: 'Quitar mesa', confirmText: 'Quitar', danger: true });
                    if (!ok) return;
                    try {
                        const response = await fetch(`${API_URL}/${id}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (!response.ok) {
                            const data = await response.json();
                            throw new Error(data.error || 'Error al quitar la mesa.');
                        }
                        await fetchMesas();
                        renderAdminMesas();
                    } catch (error) {
                        DS.toast('Error: ' + error.message, { type: 'error', duration: 0 });
                    }
                }
            });

            formNuevaMesa.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nombre = document.getElementById('nombre-nueva-mesa').value.trim();
                if (!nombre) return;
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ nombre })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Error al agregar la mesa.');
                    formNuevaMesa.reset();
                    await fetchMesas();
                    renderAdminMesas();
                } catch (error) {
                    DS.toast('Error: ' + error.message, { type: 'error', duration: 0 });
                }
            });

            document.querySelectorAll('.close').forEach(el => el.addEventListener('click', () => { modalAdmin.style.display = 'none'; }));
            window.addEventListener('click', (e) => { if (e.target === modalAdmin) modalAdmin.style.display = 'none'; });

            // --- INICIALIZACIÓN ---
            fetchMesas();
            setInterval(fetchMesas, 20000);
        });
    </script>
</body>
</html>
